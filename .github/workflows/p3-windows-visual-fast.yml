name: p3-windows-visual-fast

on:
  push:
    branches:
      - agent/p3-semantic-building-compiler
    paths:
      - .github/workflows/p3-windows-visual-fast.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p3-windows-visual-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64 P3 fast validation package
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Require committed dependency lockfile
        shell: pwsh
        run: |
          if (-not (Test-Path Cargo.lock)) {
            throw "Cargo.lock is missing."
          }

      - name: Build P3 visual prototype without release LTO
        run: cargo build --locked -p building_visual

      - name: Assemble validation package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/debug/building_visual.exe dist/building_visual.exe
          Copy-Item docs/visual-acceptance/p3-checklist.md dist/p3-checklist.md
          Copy-Item scripts/collect_p3_machine_info.ps1 dist/collect_p3_machine_info.ps1
          @"
          # P3 Windows 快速视觉验证包

          该程序为 Debug 构建，用于功能与空间正确性验收，不用于最终性能结论。

          1. 运行环境采集：
             powershell -ExecutionPolicy Bypass -File .\collect_p3_machine_info.ps1
          2. 启动原型：
             .\building_visual.exe
          3. 按 p3-checklist.md 完成检查。

          操作：M 表现模式；X 剖视；W 加/减窗；O 移动平台；A/D 环绕；上下键调整高度；R 重置。
          "@ | Set-Content -Encoding UTF8 dist/RUN.md

      - name: Upload fast Windows package
        uses: actions/upload-artifact@v4
        with:
          name: p3-semantic-building-windows-x64-fast
          path: dist
          if-no-files-found: error
          retention-days: 30
