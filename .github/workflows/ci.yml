name: ci

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrated-clippy-autofix:
    name: temporary integrated P4 Clippy cleanup
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/agent/p4-integrated-world-pipeline') ||
      (github.event_name == 'pull_request' && github.head_ref == 'agent/p4-integrated-world-pipeline')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout integrated branch
        uses: actions/checkout@v4
        with:
          ref: agent/p4-integrated-world-pipeline

      - name: Apply exact strict-Clippy fixes
        shell: python
        run: |
          from pathlib import Path

          atlas = Path("crates/integrated_world_core/src/atlas.rs")
          text = atlas.read_text(encoding="utf-8")
          text = text.replace(
              "    let settlement_cell = manifest\n        .cell(settlement.cell)\n        .expect(\"settlement cell exists\");\n",
              "",
              1,
          )
          old = """        if let Some(cell) = manifest.cells.iter().min_by(|left, right| {
            left.center_world
                .xz()
                .distance_squared(point.xz())
                .total_cmp(&right.center_world.xz().distance_squared(point.xz()))
        }) {
            if cell.center_world.xz().distance(point.xz()) <= manifest.cell_radius_m * 1.35 {
                touched.insert(cell.coord);
            }
        }
"""
          new = """        if let Some(cell) = manifest.cells.iter().min_by(|left, right| {
            left.center_world
                .xz()
                .distance_squared(point.xz())
                .total_cmp(&right.center_world.xz().distance_squared(point.xz()))
        }) && cell.center_world.xz().distance(point.xz()) <= manifest.cell_radius_m * 1.35
        {
            touched.insert(cell.coord);
        }
"""
          if old in text:
              text = text.replace(old, new, 1)
          atlas.write_text(text, encoding="utf-8")

          traversal = Path("crates/integrated_world_core/src/traversal.rs")
          text = traversal.read_text(encoding="utf-8")
          text = text.replace(
              "fn nearest_sample<'a>(grid: &'a TerrainGrid, point: DVec2) -> &'a TerrainSample {",
              "fn nearest_sample(grid: &TerrainGrid, point: DVec2) -> &TerrainSample {",
              1,
          )
          traversal.write_text(text, encoding="utf-8")

          Path(".github/workflows/p4-integrated-clippy-fix.yml").unlink(missing_ok=True)

      - name: Install Rustfmt
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Format, rebase and push
        shell: bash
        run: |
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No strict-Clippy cleanup changes remain."
            exit 0
          fi
          git commit -m "Clean integrated P4 strict Clippy findings"
          git pull --rebase origin agent/p4-integrated-world-pipeline
          git push origin HEAD:agent/p4-integrated-world-pipeline

  validate:
    name: architecture, rust, headless prototype
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bevy Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            g++ \
            pkg-config \
            libx11-dev \
            libasound2-dev \
            libudev-dev \
            libxkbcommon-x11-0 \
            libwayland-dev \
            libxkbcommon-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run static preproduction checks
        run: ./scripts/run_static_checks.sh

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Resolve dependency lockfile
        run: cargo generate-lockfile

      - name: Check workspace including Bevy applications
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          cargo check --workspace --all-targets --locked --message-format=short 2>&1 | tee artifacts/workspace-check.log
          status=${PIPESTATUS[0]}
          grep -E '(^|: )(error(\[E[0-9]+\])?:|warning:)' artifacts/workspace-check.log > artifacts/workspace-check-summary.txt || true
          exit "$status"

      - name: Upload workspace-check diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-check-diagnostics
          path: |
            artifacts/workspace-check.log
            artifacts/workspace-check-summary.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Clippy workspace including Bevy applications
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test engine-independent crates and headless applications
        run: >-
          cargo test --workspace
          --exclude camera_routes
          --exclude mobile_region_visual
          --exclude building_visual
          --exclude world_visual
          --all-targets --locked

      - name: Generate P1 headless camera trace
        run: cargo run --locked -p camera_trace -- artifacts/p1-camera-trace.json

      - name: Generate P2 headless reference-frame trace
        run: >-
          cargo run --locked -p p2_reference_frame_trace --
          artifacts/p2-reference-frame-trace.json

      - name: Generate P3 headless building compiler trace
        run: >-
          cargo run --locked -p p3_building_trace --
          artifacts/p3-building-trace.json

      - name: Generate P4A deterministic world trace
        run: >-
          cargo run --locked -p p4_world_trace --
          artifacts/p4-world-trace.json

      - name: Generate integrated P4 Atlas-to-scroll trace
        run: >-
          cargo run --locked -p p4_integrated_trace --
          artifacts/p4-integrated-world-trace.json

      - name: Upload dependency lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: Cargo.lock
          if-no-files-found: warn

      - name: Upload headless evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: headless-prototype-evidence
          path: |
            artifacts/p1-camera-trace.json
            artifacts/p2-reference-frame-trace.json
            artifacts/p3-building-trace.json
            artifacts/p4-world-trace.json
            artifacts/p4-integrated-world-trace.json
          if-no-files-found: error
