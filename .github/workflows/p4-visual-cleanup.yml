name: p4-visual-cleanup

on:
  push:
    branches:
      - agent/p4-deterministic-world-generation

permissions:
  contents: write

concurrency:
  group: p4-visual-cleanup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    name: clean and format P4 world visual source
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout P4 source branch
        uses: actions/checkout@v4
        with:
          ref: agent/p4-deterministic-world-generation

      - name: Remove unused retained manifest field
        shell: python
        run: |
          from pathlib import Path

          path = Path("apps/world_visual/src/main.rs")
          text = path.read_text(encoding="utf-8")
          text = text.replace("    manifest: WorldManifest,\n", "")
          text = text.replace("        manifest,\n        routes,\n", "        routes,\n")
          path.write_text(text, encoding="utf-8")

      - name: Install Rustfmt
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Apply rustfmt
        run: cargo fmt --all

      - name: Commit cleanup when changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/world_visual/src/main.rs
          if git diff --cached --quiet; then
            echo "P4 visual source is already clean and formatted."
            exit 0
          fi
          git commit -m "Format P4 generated world visual"
          git push origin HEAD:agent/p4-deterministic-world-generation
