name: p1-windows-visual-package

on:
  push:
    branches:
      - "agent/**"
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - "apps/camera_routes/**"
      - "crates/p1_scenario/**"
      - "crates/scroll_camera_core/**"
      - "crates/world_math/**"
      - "docs/visual-acceptance/**"
      - "scripts/collect_p1_machine_info_v2.ps1"
      - .github/workflows/p1-windows-visual-package.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-windows-visual-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64 P1 validation package
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Require committed dependency lockfile
        shell: pwsh
        run: |
          if (-not (Test-Path Cargo.lock)) {
            throw "Cargo.lock is missing. The dependency-lockfile workflow must complete first."
          }

      - name: Build P1 visual prototype
        run: cargo build --locked --release -p camera_routes

      - name: Assemble validation package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/camera_routes.exe dist/camera_routes.exe
          Copy-Item docs/visual-acceptance/p1-checklist.md dist/p1-checklist.md
          Copy-Item scripts/collect_p1_machine_info_v2.ps1 dist/collect_p1_machine_info.ps1
          @"
          # P1 Windows 视觉验证包

          1. 运行环境采集：
             powershell -ExecutionPolicy Bypass -File .\collect_p1_machine_info.ps1
          2. 启动原型：
             .\camera_routes.exe
          3. 按 p1-checklist.md 完成正向、反向路线和固定检查点记录。

          操作：
          - Space：暂停或继续自动行进
          - Left / Right 或 A / D：反向或正向移动
          - R：回到路线起点

          本程序只验证 P1 卷轴摄影机、路线转向和固定世界地标，不代表正式游戏画面。
          "@ | Set-Content -Encoding UTF8 dist/RUN.md

      - name: Upload validated Windows package
        uses: actions/upload-artifact@v4
        with:
          name: p1-camera-routes-windows-x64-validated
          path: dist
          if-no-files-found: error
          retention-days: 30
