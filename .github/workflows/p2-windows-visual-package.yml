name: p4-integrated-one-shot-core-gate

on:
  push:
    branches:
      - agent/p4-integrated-world-pipeline
    paths:
      - .github/workflows/p2-windows-visual-package.yml
  pull_request:
    paths:
      - .github/workflows/p2-windows-visual-package.yml

permissions:
  contents: write

concurrency:
  group: p4-integrated-one-shot-core-gate
  cancel-in-progress: false

jobs:
  gate:
    name: integrated P4 core gates and evidence
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout integrated branch
        uses: actions/checkout@v4
        with:
          ref: agent/p4-integrated-world-pipeline
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Apply source cleanup
        shell: python
        run: |
          from pathlib import Path

          atlas = Path("crates/integrated_world_core/src/atlas.rs")
          text = atlas.read_text(encoding="utf-8")
          text = text.replace(
              "    let settlement_cell = manifest\n        .cell(settlement.cell)\n        .expect(\"settlement cell exists\");\n",
              "",
              1,
          )
          old = """        if let Some(cell) = manifest.cells.iter().min_by(|left, right| {
            left.center_world
                .xz()
                .distance_squared(point.xz())
                .total_cmp(&right.center_world.xz().distance_squared(point.xz()))
        }) {
            if cell.center_world.xz().distance(point.xz()) <= manifest.cell_radius_m * 1.35 {
                touched.insert(cell.coord);
            }
        }
"""
          new = """        if let Some(cell) = manifest.cells.iter().min_by(|left, right| {
            left.center_world
                .xz()
                .distance_squared(point.xz())
                .total_cmp(&right.center_world.xz().distance_squared(point.xz()))
        }) && cell.center_world.xz().distance(point.xz()) <= manifest.cell_radius_m * 1.35
        {
            touched.insert(cell.coord);
        }
"""
          if old in text:
              text = text.replace(old, new, 1)
          atlas.write_text(text, encoding="utf-8")

          traversal = Path("crates/integrated_world_core/src/traversal.rs")
          text = traversal.read_text(encoding="utf-8")
          text = text.replace(
              "fn nearest_sample<'a>(grid: &'a TerrainGrid, point: DVec2) -> &'a TerrainSample {",
              "fn nearest_sample(grid: &TerrainGrid, point: DVec2) -> &TerrainSample {",
              1,
          )
          traversal.write_text(text, encoding="utf-8")

          lib = Path("crates/integrated_world_core/src/lib.rs")
          text = lib.read_text(encoding="utf-8")
          text = text.replace(
              "#![allow(unused_variables, clippy::collapsible_if, clippy::needless_lifetimes)]\n",
              "",
              1,
          )
          lib.write_text(text, encoding="utf-8")

          for path in [
              Path(".github/workflows/p4-integrated-clippy-fix.yml"),
              Path(".github/workflows/p4-integrated-core-diagnostic.yml"),
          ]:
              path.unlink(missing_ok=True)

      - name: Run core gates and write evidence
        id: core
        shell: bash
        run: |
          set +e
          mkdir -p artifacts docs/evidence
          cargo fmt --all
          {
            echo '## cargo check'
            cargo check --locked -p integrated_world_core -p p4_integrated_scenario -p p4_integrated_trace --all-targets
            echo '## cargo clippy'
            cargo clippy --locked -p integrated_world_core -p p4_integrated_scenario -p p4_integrated_trace --all-targets -- -D warnings
            echo '## cargo test'
            cargo test --locked -p integrated_world_core -p p4_integrated_scenario -p p4_integrated_trace --all-targets
            echo '## integrated trace'
            cargo run --locked -p p4_integrated_trace -- artifacts/p4-integrated-world-trace.json
          } > artifacts/p4-integrated-core.log 2>&1
          status=$?
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          result=FAIL
          [ "$status" -eq 0 ] && result=PASS
          {
            echo '# P4 integrated core gates'
            echo
            echo "Result: **${result}**"
            echo
            echo "Workflow run: ${GITHUB_RUN_ID}"
            echo "Source commit: ${GITHUB_SHA}"
            echo
            echo '```text'
            tail -n 260 artifacts/p4-integrated-core.log
            echo '```'
          } > docs/evidence/p4-integrated-core-diagnostic.md
          exit 0

      - name: Restore original P2 workflow
        shell: bash
        run: |
          cat > .github/workflows/p2-windows-visual-package.yml <<'YAML'
          name: p2-windows-visual-package

          on:
            push:
              branches:
                - "agent/p2-**"
              paths:
                - Cargo.toml
                - Cargo.lock
                - rust-toolchain.toml
                - "apps/mobile_region_visual/**"
                - "crates/mobile_region_core/**"
                - "crates/world_math/**"
                - "docs/visual-acceptance/p2-checklist.md"
                - "scripts/collect_p2_machine_info.ps1"
                - .github/workflows/p2-windows-visual-package.yml
            pull_request:
              paths:
                - Cargo.toml
                - Cargo.lock
                - rust-toolchain.toml
                - "apps/mobile_region_visual/**"
                - "crates/mobile_region_core/**"
                - "crates/world_math/**"
                - "docs/visual-acceptance/p2-checklist.md"
                - "scripts/collect_p2_machine_info.ps1"
                - .github/workflows/p2-windows-visual-package.yml
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: p2-windows-visual-package-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            build:
              name: Windows x64 P2 validation package
              runs-on: windows-latest
              timeout-minutes: 60
              steps:
                - name: Checkout
                  uses: actions/checkout@v4
                - name: Install Rust toolchain
                  uses: dtolnay/rust-toolchain@master
                  with:
                    toolchain: 1.97.1
                - name: Cache Cargo
                  uses: Swatinem/rust-cache@v2
                - name: Require committed dependency lockfile
                  shell: pwsh
                  run: |
                    if (-not (Test-Path Cargo.lock)) {
                      throw "Cargo.lock is missing."
                    }
                - name: Build P2 visual prototype
                  run: cargo build --locked -p mobile_region_visual
                - name: Assemble validation package
                  shell: pwsh
                  run: |
                    New-Item -ItemType Directory -Force -Path dist | Out-Null
                    Copy-Item target/debug/mobile_region_visual.exe dist/mobile_region_visual.exe
                    Copy-Item docs/visual-acceptance/p2-checklist.md dist/p2-checklist.md
                    Copy-Item scripts/collect_p2_machine_info.ps1 dist/collect_p2_machine_info.ps1
                    @"
                    # P2 Windows 视觉验证包

                    1. 运行环境采集：
                       powershell -ExecutionPolicy Bypass -File .\collect_p2_machine_info.ps1
                    2. 启动原型：
                       .\mobile_region_visual.exe
                    3. 按 p2-checklist.md 完成录像和检查。
                    "@ | Set-Content -Encoding UTF8 dist/RUN.md
                - name: Upload validated Windows package
                  uses: actions/upload-artifact@v4
                  with:
                    name: p2-mobile-reference-frame-windows-x64
                    path: dist
                    if-no-files-found: error
                    retention-days: 30
          YAML

      - name: Commit source fixes, evidence and workflow restoration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Persist integrated P4 core gates and evidence"
          git pull --rebase origin agent/p4-integrated-world-pipeline
          git push origin HEAD:agent/p4-integrated-world-pipeline

      - name: Fail after evidence is committed when gates fail
        if: steps.core.outputs.status != '0'
        run: exit 1
