name: p4-clippy-cleanup

on:
  push:
    branches:
      - agent/p4-deterministic-world-generation

permissions:
  contents: write

concurrency:
  group: p4-clippy-cleanup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    name: apply exact P4 Clippy cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout P4 branch
        uses: actions/checkout@v4
        with:
          ref: agent/p4-deterministic-world-generation

      - name: Collapse the validated nested condition
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/world_generation_core/src/generate.rs")
          text = path.read_text(encoding="utf-8")
          old = """    if let Some(next) = cells.get(index + 1).copied() {
        if (drafts[&coord].elevation_m - drafts[&next].elevation_m).abs() >= 70.0 {
            return ScrollGrammar::VerticalTransition;
        }
    }
"""
          new = """    if let Some(next) = cells.get(index + 1).copied()
        && (drafts[&coord].elevation_m - drafts[&next].elevation_m).abs() >= 70.0
    {
        return ScrollGrammar::VerticalTransition;
    }
"""
          if old not in text:
              raise SystemExit("expected P4 condition was not found")
          path.write_text(text.replace(old, new), encoding="utf-8")

      - name: Install Rustfmt
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Apply rustfmt
        run: cargo fmt --all

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/world_generation_core/src/generate.rs
          if git diff --cached --quiet; then
            echo "P4 Clippy cleanup is already applied."
            exit 0
          fi
          git commit -m "Clean P4 strict lint finding"
          git push origin HEAD:agent/p4-deterministic-world-generation
