name: p3-visual-format

on:
  push:
    branches:
      - agent/p3-semantic-building-compiler

permissions:
  contents: write

concurrency:
  group: p3-visual-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: clean and format P3 visual source
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/p3-semantic-building-compiler

      - name: Remove exact visual harness leftovers
        shell: python
        run: |
          from pathlib import Path
          path = Path("apps/building_visual/src/main.rs")
          text = path.read_text(encoding="utf-8")
          text = text.replace("    Aabb3, BlueprintDelta, BuildingBlueprint, BuildingCompilation, BuildingInstanceBinding,\n", "    Aabb3, BuildingBlueprint, BuildingCompilation, BuildingInstanceBinding,\n")
          text = text.replace("        let progress = (f64::from(index) + 0.5) / f64::from(steps);\n", "")
          text = text.replace("        let _ = progress;\n", "")
          path.write_text(text, encoding="utf-8")

      - name: Install Rustfmt
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Apply rustfmt
        run: cargo fmt --all

      - name: Commit formatted visual source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          if git diff --cached --quiet; then
            echo "P3 visual sources are already clean and formatted."
            exit 0
          fi
          git commit -m "Format P3 visual prototype"
          git push origin HEAD:agent/p3-semantic-building-compiler
