name: p7-bootstrap-source

on:
  push:
    branches:
      - agent/p7-interest-region-authority
    paths:
      - '.github/workflows/p7-bootstrap-source.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p7-interest-region-authority
      - name: Materialize P7 source overlay
        shell: bash
        run: |
          cat > /tmp/p7-overlay.b64 <<'PAYLOAD'
[... ELLIPSIZATION ...]
PAYLOAD
          base64 -d /tmp/p7-overlay.b64 > /tmp/p7-overlay.tar.gz
          tar -xzf /tmp/p7-overlay.tar.gz
          rm .github/workflows/p7-bootstrap-source.yml
      - name: Commit P7 source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement P7 interest and region authority validation"
          git push origin HEAD:agent/p7-interest-region-authority
