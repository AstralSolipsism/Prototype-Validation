name: p4-integrated-final-gate

on:
  push:
    branches:
      - agent/p4-integrated-world-pipeline
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p4-integrated-final-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  INTEGRATED_BRANCH: agent/p4-integrated-world-pipeline

jobs:
  finalize:
    name: persist deterministic integrated P4 source fixes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}

    steps:
      - name: Checkout integrated branch with history
        uses: actions/checkout@v4
        with:
          ref: ${{ env.INTEGRATED_BRANCH }}
          fetch-depth: 0

      - name: Install Rustfmt
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Apply deterministic source finalizer
        run: python scripts/finalize_p4_integrated.py

      - name: Remove superseded one-shot workflows
        shell: bash
        run: |
          rm -f \
            .github/workflows/p4-integrated-clippy-fix.yml \
            .github/workflows/p4-integrated-core-diagnostic.yml

      - name: Format and resolve dependency lockfile
        run: |
          cargo fmt --all
          cargo generate-lockfile

      - name: Commit finalized source when changed
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Finalize integrated P4 automated gate fixes"
            for attempt in 1 2 3 4; do
              if git push origin "HEAD:${INTEGRATED_BRANCH}"; then
                break
              fi
              if [ "$attempt" -eq 4 ]; then
                exit 1
              fi
              git fetch origin "${INTEGRATED_BRANCH}"
              git rebase "origin/${INTEGRATED_BRANCH}"
            done
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  validate:
    name: architecture, Rust, deterministic evidence and Bevy build
    needs: finalize
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout finalized integrated branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.INTEGRATED_BRANCH }}

      - name: Install Bevy Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            g++ \
            pkg-config \
            libx11-dev \
            libasound2-dev \
            libudev-dev \
            libxkbcommon-x11-0 \
            libwayland-dev \
            libxkbcommon-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run static preproduction checks
        run: ./scripts/run_static_checks.sh

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Require committed dependency lockfile
        shell: bash
        run: test -f Cargo.lock

      - name: Check complete workspace including Bevy applications
        run: cargo check --workspace --all-targets --locked

      - name: Run strict Clippy across complete workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test engine-independent crates and headless applications
        run: >-
          cargo test --workspace
          --exclude camera_routes
          --exclude mobile_region_visual
          --exclude building_visual
          --exclude world_visual
          --exclude integrated_world_visual
          --all-targets --locked

      - name: Generate deterministic headless evidence
        shell: bash
        run: |
          mkdir -p artifacts
          cargo run --locked -p camera_trace -- artifacts/p1-camera-trace.json
          cargo run --locked -p p2_reference_frame_trace -- artifacts/p2-reference-frame-trace.json
          cargo run --locked -p p3_building_trace -- artifacts/p3-building-trace.json
          cargo run --locked -p p4_world_trace -- artifacts/p4-world-trace.json
          cargo run --locked -p p4_integrated_trace -- artifacts/p4-integrated-world-trace.json

      - name: Build integrated Bevy visual application on Linux
        run: cargo build --locked -p integrated_world_visual

      - name: Upload automated evidence
        uses: actions/upload-artifact@v4
        with:
          name: p4-integrated-automated-evidence
          path: |
            artifacts/p1-camera-trace.json
            artifacts/p2-reference-frame-trace.json
            artifacts/p3-building-trace.json
            artifacts/p4-world-trace.json
            artifacts/p4-integrated-world-trace.json
          if-no-files-found: error
          retention-days: 30

  package:
    name: Windows x64 final manual acceptance package
    needs:
      - finalize
      - validate
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout validated integrated branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.INTEGRATED_BRANCH }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Download automated evidence
        uses: actions/download-artifact@v4
        with:
          name: p4-integrated-automated-evidence
          path: evidence

      - name: Build integrated Windows visual application
        run: cargo build --locked -p integrated_world_visual

      - name: Assemble final manual acceptance package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/debug/integrated_world_visual.exe dist/integrated_world_visual.exe
          Copy-Item docs/visual-acceptance/p4-integrated-checklist.md dist/p4-integrated-checklist.md
          Copy-Item scripts/collect_p4_integrated_machine_info.ps1 dist/collect_p4_integrated_machine_info.ps1
          Copy-Item evidence/p4-integrated-world-trace.json dist/p4-integrated-world-trace.json
          @"
          # P4 Atlas 到卷轴世界综合人工验收包

          本包用于 P4 最终端到端技术验收，不代表正式美术、内容规模或最终性能。

          Validated source: ${{ needs.finalize.outputs.source_sha }}
          Workflow run: $env:GITHUB_RUN_ID

          ## 运行

          1. 解压整个压缩包，不要直接在 ZIP 内运行。
          2. 在解压目录打开 PowerShell。
          3. 执行：

             powershell -ExecutionPolicy Bypass -File .\collect_p4_integrated_machine_info.ps1
             .\integrated_world_visual.exe

          4. 按 p4-integrated-checklist.md 完成完整连续验收。

          ## 操作

          - M：Atlas / 局部世界切换
          - Tab：切换 Atlas 图层
          - Q / E：选择地块
          - Enter：进入已物化地块
          - 1 / 2 / 3：选择路线并开始卷轴旅行
          - Space：暂停 / 继续
          - V：切换观察侧
          - L：建筑完整结构 / 外壳 / Massing
          - B：历史图层
          - C：等高线
          - H：Atlas 边界
          - T：路线显示
          - A / D 或左右键：局部总览环绕
          - 上下键：调整总览高度
          - R：重置
          "@ | Set-Content -Encoding UTF8 dist/RUN.md

      - name: Upload final Windows package
        uses: actions/upload-artifact@v4
        with:
          name: p4-integrated-atlas-to-scroll-windows-x64
          path: dist
          if-no-files-found: error
          retention-days: 30
