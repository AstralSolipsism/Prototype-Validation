[workspace]
resolver = "3"
members = [
    "crates/world_ids",
    "crates/world_time",
    "crates/deterministic_rng",
    "crates/world_math",
    "crates/protocol",
    "crates/replay_core",
    "crates/scroll_camera_core",
    "crates/p1_scenario",
    "crates/mobile_region_core",
    "apps/camera_trace",
    "apps/camera_routes",
    "apps/p2_reference_frame_trace",
    "apps/mobile_region_visual",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
bevy = { version = "=0.19.0", default-features = false, features = ["3d"] }
glam = { version = "0.32.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
