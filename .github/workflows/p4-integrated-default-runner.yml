name: p4-integrated-default-runner

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/p4-integrated-default-runner.yml
  pull_request:
    paths:
      - docs/evidence/p4-integrated-validation-trigger.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p4-integrated-default-runner
  cancel-in-progress: false

env:
  INTEGRATED_BRANCH: agent/p4-integrated-world-pipeline
  BASE_BRANCH: agent/p4-deterministic-world-generation

jobs:
  validate:
    name: validate integrated P4 and persist focused fixes
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}

    steps:
      - name: Checkout integrated branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.INTEGRATED_BRANCH }}
          fetch-depth: 0

      - name: Fetch P4A base branch
        shell: bash
        run: git fetch origin "${BASE_BRANCH}:${BASE_BRANCH}"

      - name: Install Bevy Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            g++ pkg-config libx11-dev libasound2-dev libudev-dev \
            libxkbcommon-x11-0 libwayland-dev libxkbcommon-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Apply focused source fixes and remove temporary branch workflows
        shell: python
        run: |
          from pathlib import Path
          import re

          atlas = Path("crates/integrated_world_core/src/atlas.rs")
          text = atlas.read_text(encoding="utf-8")
          text = text.replace(
              "    let settlement_cell = manifest\n        .cell(settlement.cell)\n        .expect(\"settlement cell exists\");\n",
              "",
              1,
          )
          text = text.replace(
              """        if let Some(cell) = manifest.cells.iter().min_by(|left, right| {
            left.center_world
                .xz()
                .distance_squared(point.xz())
                .total_cmp(&right.center_world.xz().distance_squared(point.xz()))
        }) {
            if cell.center_world.xz().distance(point.xz()) <= manifest.cell_radius_m * 1.35 {
                touched.insert(cell.coord);
            }
        }
""",
              """        if let Some(cell) = manifest.cells.iter().min_by(|left, right| {
            left.center_world
                .xz()
                .distance_squared(point.xz())
                .total_cmp(&right.center_world.xz().distance_squared(point.xz()))
        }) && cell.center_world.xz().distance(point.xz()) <= manifest.cell_radius_m * 1.35
        {
            touched.insert(cell.coord);
        }
""",
              1,
          )
          atlas.write_text(text, encoding="utf-8")

          traversal = Path("crates/integrated_world_core/src/traversal.rs")
          text = traversal.read_text(encoding="utf-8")
          text = text.replace(
              "fn nearest_sample<'a>(grid: &'a TerrainGrid, point: DVec2) -> &'a TerrainSample {",
              "fn nearest_sample(grid: &TerrainGrid, point: DVec2) -> &TerrainSample {",
              1,
          )
          traversal.write_text(text, encoding="utf-8")

          history = Path("crates/integrated_world_core/src/history.rs")
          text = history.read_text(encoding="utf-8")
          text = text.replace(
              "use std::collections::BTreeSet;",
              "use std::collections::{BTreeMap, BTreeSet};",
              1,
          )
          replacement = r'''pub fn apply_history_to_atlas(
    atlas: &mut WorldAtlasManifest,
    history: &HistoryLedger,
) -> Result<(), serde_json::Error> {
    let cell_radius_m = atlas.cell_radius_m;
    let event_cells = history
        .events
        .iter()
        .map(|event| {
            let point = event.location.xz();
            let coord = atlas
                .cells
                .iter()
                .find(|cell| cell_at_position(cell.coord, cell_radius_m, point))
                .or_else(|| {
                    atlas.cells.iter().min_by(|left, right| {
                        left.center_world
                            .xz()
                            .distance_squared(point)
                            .total_cmp(&right.center_world.xz().distance_squared(point))
                    })
                })
                .map(|cell| cell.coord)
                .expect("Atlas contains cells");
            (event.id, coord)
        })
        .collect::<BTreeMap<_, _>>();

    for cell in &mut atlas.cells {
        let event_ids = history
            .events
            .iter()
            .filter(|event| event_cells.get(&event.id).copied() == Some(cell.coord))
            .map(|event| event.id)
            .collect::<Vec<_>>();
        let zones = history
            .land_use
            .iter()
            .filter(|zone| zone.source_cell == cell.coord)
            .collect::<Vec<_>>();
        if !event_ids.is_empty() || !zones.is_empty() {
            cell.history = AtlasHistorySummary {
                first_settlement_year: history
                    .events
                    .iter()
                    .filter(|event| event_ids.contains(&event.id))
                    .map(|event| event.year)
                    .min(),
                current_population: (cell.carrying_capacity * 4_500.0).round().max(80.0) as u32,
                dominant_economy: dominant_economy(zones.as_slice()),
                event_ids,
            };
        }
    }
    atlas.atlas_fingerprint = 0;
    atlas.atlas_fingerprint = digest(atlas)?;
    Ok(())
}

fn dominant_economy'''
          pattern = re.compile(
              r"pub fn apply_history_to_atlas\(.*?\n}\n\nfn dominant_economy",
              re.DOTALL,
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit("apply_history_to_atlas replacement did not match exactly once")
          history.write_text(text, encoding="utf-8")

          visual = Path("apps/integrated_world_visual/src/main.rs")
          text = visual.read_text(encoding="utf-8")
          replacement = r'''fn update_visual_visibility(
    state: Res<VisualState>,
    visuals: Query<(Entity, &VisualTag)>,
    mut commands: Commands,
) {
    for (entity, tag) in &visuals {
        let space_visible = match tag.space {
            VisualSpace::Atlas => state.mode == AppMode::Atlas,
            VisualSpace::Local => state.mode != AppMode::Atlas,
        };
        let kind_visible = match tag.kind {
            VisualKind::Always => true,
            VisualKind::AtlasBoundary => state.show_atlas_boundaries,
            VisualKind::AtlasContour => state.show_contours,
            VisualKind::AtlasHistory | VisualKind::LocalHistory => state.show_history,
            VisualKind::LocalRoute => state.show_routes,
            VisualKind::RouteSubject => state.mode == AppMode::RouteTravel,
            VisualKind::BuildingFull => state.building_lod == BuildingLod::Full,
            VisualKind::BuildingShell => state.building_lod == BuildingLod::Shell,
            VisualKind::BuildingMassing => state.building_lod == BuildingLod::Massing,
        };
        commands.entity(entity).insert(if space_visible && kind_visible {
            Visibility::Visible
        } else {
            Visibility::Hidden
        });
    }
}

fn update_atlas_cell_materials'''
          pattern = re.compile(
              r"fn update_visual_visibility\(.*?\n}\n\nfn update_atlas_cell_materials",
              re.DOTALL,
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit("update_visual_visibility replacement did not match exactly once")
          visual.write_text(text, encoding="utf-8")

          lib = Path("crates/integrated_world_core/src/lib.rs")
          text = lib.read_text(encoding="utf-8")
          text = text.replace(
              "#![allow(unused_variables, clippy::collapsible_if, clippy::needless_lifetimes)]\n",
              "",
              1,
          )
          lib.write_text(text, encoding="utf-8")

          for temporary in [
              Path(".github/workflows/p4-integrated-clippy-fix.yml"),
              Path(".github/workflows/p4-integrated-core-diagnostic.yml"),
          ]:
              temporary.unlink(missing_ok=True)

      - name: Restore inherited workflows from the P4A base branch
        shell: bash
        run: |
          for path in \
            .github/workflows/ci.yml \
            .github/workflows/lockfile.yml \
            .github/workflows/p2-windows-visual-package.yml \
            .github/workflows/p4-windows-visual-package.yml
          do
            git show "${BASE_BRANCH}:${path}" > "${path}"
          done

      - name: Format and resolve lockfile
        run: |
          cargo fmt --all
          cargo generate-lockfile

      - name: Persist focused fixes on the integrated branch
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Prepare integrated P4 for final automated validation"
            git push origin "HEAD:${INTEGRATED_BRANCH}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run static preproduction checks
        run: ./scripts/run_static_checks.sh

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace including Bevy applications
        run: cargo check --workspace --all-targets --locked

      - name: Clippy workspace including Bevy applications
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test engine-independent crates and headless applications
        run: >-
          cargo test --workspace
          --exclude camera_routes
          --exclude mobile_region_visual
          --exclude building_visual
          --exclude world_visual
          --exclude integrated_world_visual
          --all-targets --locked

      - name: Generate all headless evidence
        shell: bash
        run: |
          mkdir -p artifacts
          cargo run --locked -p camera_trace -- artifacts/p1-camera-trace.json
          cargo run --locked -p p2_reference_frame_trace -- artifacts/p2-reference-frame-trace.json
          cargo run --locked -p p3_building_trace -- artifacts/p3-building-trace.json
          cargo run --locked -p p4_world_trace -- artifacts/p4-world-trace.json
          cargo run --locked -p p4_integrated_trace -- artifacts/p4-integrated-world-trace.json

      - name: Build integrated Bevy visual application on Linux
        run: cargo build --locked -p integrated_world_visual

      - name: Upload automated evidence
        uses: actions/upload-artifact@v4
        with:
          name: p4-integrated-automated-evidence
          path: |
            artifacts/p1-camera-trace.json
            artifacts/p2-reference-frame-trace.json
            artifacts/p3-building-trace.json
            artifacts/p4-world-trace.json
            artifacts/p4-integrated-world-trace.json
          if-no-files-found: error
          retention-days: 30

  package:
    name: build final Windows x64 manual validation package
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout validated integrated branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.INTEGRATED_BRANCH }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Download automated evidence
        uses: actions/download-artifact@v4
        with:
          name: p4-integrated-automated-evidence
          path: evidence

      - name: Build integrated Windows visual application
        run: cargo build --locked -p integrated_world_visual

      - name: Assemble final manual validation package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/debug/integrated_world_visual.exe dist/integrated_world_visual.exe
          Copy-Item docs/visual-acceptance/p4-integrated-checklist.md dist/p4-integrated-checklist.md
          Copy-Item scripts/collect_p4_integrated_machine_info.ps1 dist/collect_p4_integrated_machine_info.ps1
          Copy-Item evidence/p4-integrated-world-trace.json dist/p4-integrated-world-trace.json
          @"
          # P4 Atlas 到卷轴世界综合人工验收包

          本包只用于 P4 最终端到端技术验收，不代表正式美术、内容规模或最终性能。

          Validated source: ${{ needs.validate.outputs.source_sha }}
          Workflow run: $env:GITHUB_RUN_ID

          ## 运行

          1. 解压整个压缩包，不要直接在 ZIP 内运行。
          2. 在解压目录打开 PowerShell。
          3. 执行：

             powershell -ExecutionPolicy Bypass -File .\collect_p4_integrated_machine_info.ps1
             .\integrated_world_visual.exe

          4. 严格按照 p4-integrated-checklist.md 完成一轮连续验收。

          ## 主要操作

          - M：Atlas / 局部世界切换
          - Tab：切换 Atlas 图层
          - Q / E：选择相邻地块
          - Enter：进入已物化地块
          - 1 / 2 / 3：选择卷轴路线并开始旅行
          - Space：暂停 / 继续
          - V：切换观察侧
          - L：建筑完整结构 / 外壳 / Massing
          - B：历史图层
          - C：等高线
          - H：Atlas 边界
          - T：路线显示
          - A / D 或左右键：局部总览环绕
          - 上下键：调整总览高度
          - R：重置
          "@ | Set-Content -Encoding UTF8 dist/RUN.md

      - name: Upload final Windows manual validation package
        uses: actions/upload-artifact@v4
        with:
          name: p4-integrated-atlas-to-scroll-windows-x64
          path: dist
          if-no-files-found: error
          retention-days: 30
