name: dependency-lockfile

on:
  push:
    branches:
      - "agent/**"
    paths:
      - Cargo.toml
      - "**/Cargo.toml"
      - rust-toolchain.toml
      - .github/workflows/lockfile.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: generate and commit Cargo.lock
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Generate dependency lockfile
        run: cargo generate-lockfile

      - name: Commit lockfile when changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock is already current."
            exit 0
          fi
          git commit -m "Lock Rust dependencies"
          git push origin "HEAD:${GITHUB_REF_NAME}"
