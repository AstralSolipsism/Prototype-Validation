name: p6-pr-validation

on:
  pull_request:
    branches:
      - agent/p5-authoritative-server-persistence
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'apps/**'
      - 'scripts/**'
      - 'docs/visual-acceptance/p6-simulation-scale-checklist.md'
      - '.github/workflows/p6-pr-validation.yml'
      - 'prototype-status.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p6-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: simulation tiers, event calendar, million-person scale and regressions
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout exact P6 source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Bevy Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            g++ pkg-config libx11-dev libasound2-dev libudev-dev \
            libxkbcommon-x11-0 libwayland-dev libxkbcommon-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Static architecture and stage checks
        run: ./scripts/run_static_checks.sh

      - name: Normalize formatting and generate dependency lock
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo generate-lockfile
          test -f Cargo.lock

      - name: Complete workspace compilation
        run: cargo check --workspace --all-targets --locked

      - name: Complete workspace strict Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Engine-independent tests
        run: |
          cargo test --workspace \
            --exclude camera_routes \
            --exclude mobile_region_visual \
            --exclude building_visual \
            --exclude world_visual \
            --exclude integrated_world_visual \
            --exclude p4_region_scale_visual \
            --all-targets --locked

      - name: Generate P0-P5 regression evidence
        run: |
          mkdir -p artifacts
          cargo run --locked -p camera_trace -- artifacts/p1-camera-trace.json
          cargo run --locked -p p2_reference_frame_trace -- artifacts/p2-reference-frame-trace.json
          cargo run --locked -p p3_building_trace -- artifacts/p3-building-trace.json
          cargo run --locked -p p4_region_scale_trace -- artifacts/p4-region-scale-trace.json
          cargo run --locked -p p5_authority_trace -- artifacts/p5-authority-trace.json

      - name: Run P6 million-person scale trace
        run: cargo run --release --locked -p p6_simulation_trace -- artifacts/p6-simulation-scale-trace.json

      - name: Run P6 interactive executable in automatic mode
        run: cargo run --release --locked -p p6_manual_validation -- --auto --data-dir artifacts/p6-manual-smoke

      - name: Assert P6 semantic and scale evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('artifacts/p6-simulation-scale-trace.json').read_text(encoding='utf-8'))
          assert report['all_passed'] is True, report
          assert report['fingerprints_match'] is True, report
          first = report['first_run']
          assert first['config']['cold_population'] == 1_000_000, first
          assert first['config']['warm_population'] == 10_000, first
          assert first['config']['hot_population'] == 300, first
          assert first['cold_metrics']['full_population_scans'] == 0, first
          assert first['warm_metrics']['full_population_scans'] == 0, first
          assert first['transition']['facts_preserved'] is True, first
          assert first['transition']['people_exercised'] >= 64, first
          assert first['hot_caches_valid_after_rebuild'] is True, first
          assert first['memory']['total_model_bytes'] <= 128 * 1024 * 1024, first
          assert first['timings_ms']['total'] <= 120_000, first

          smoke = json.loads(Path('artifacts/p6-manual-smoke/p6-validation-report.json').read_text(encoding='utf-8'))
          assert smoke['all_passed'] is True, smoke
          assert smoke['first_run']['fingerprint'] == smoke['repeat_run']['fingerprint'], smoke
          print('P6 semantic and scale evidence passed.')
          PY

      - name: Build prior regressions and P6 manual executable
        run: |
          cargo build --locked -p p5_manual_validation
          cargo build --release --locked -p p6_manual_validation

      - name: Write gate summary
        run: |
          {
            echo '# P6 simulation scale automated gate'
            echo
            echo 'Result: **PASS**'
            echo
            echo "Validated source: ${{ github.event.pull_request.head.sha || github.sha }}"
            echo "Workflow run: ${GITHUB_RUN_ID}"
            echo
            echo '- 1,000,000 compact Cold identities'
            echo '- 10,000 event-driven Warm people'
            echo '- 300 fixed-step Hot people'
            echo '- no full-population scan in Cold or Warm advancement'
            echo '- 30-day accelerated simulation'
            echo '- Cold/Warm/Hot round-trip continuity'
            echo '- disposable and rebuildable Hot runtime caches'
            echo '- sparse significant history'
            echo '- deterministic repeat fingerprint'
            echo '- P0 through P5 regression checks'
          } > artifacts/p6-simulation-scale-gate-summary.md

      - name: Upload P6 automated evidence and generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: p6-simulation-scale-automated-evidence
          path: |
            Cargo.lock
            artifacts/p1-camera-trace.json
            artifacts/p2-reference-frame-trace.json
            artifacts/p3-building-trace.json
            artifacts/p4-region-scale-trace.json
            artifacts/p5-authority-trace.json
            artifacts/p6-simulation-scale-trace.json
            artifacts/p6-simulation-scale-trace.data/p6-validation-report.json
            artifacts/p6-simulation-scale-trace.data/p6-tier-transition.json
            artifacts/p6-manual-smoke/p6-validation-report.json
            artifacts/p6-manual-smoke/p6-tier-transition.json
            artifacts/p6-simulation-scale-gate-summary.md
          if-no-files-found: error
          retention-days: 30

  package:
    name: Windows x64 P6 manual acceptance package
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout exact validated P6 source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Download P6 automated evidence
        uses: actions/download-artifact@v4
        with:
          name: p6-simulation-scale-automated-evidence
          path: evidence

      - name: Install exact Linux-validated Cargo lockfile
        shell: pwsh
        run: |
          $lock = Get-ChildItem evidence -Recurse -Filter Cargo.lock | Select-Object -First 1
          if ($null -eq $lock) { throw 'Validated Cargo.lock was not found.' }
          Copy-Item $lock.FullName .\Cargo.lock -Force

      - name: Build P6 release executable
        run: cargo build --release --locked -p p6_manual_validation

      - name: Run Windows automatic scale validation
        shell: pwsh
        run: |
          .\target\release\p6_manual_validation.exe --auto --data-dir p6-windows-smoke
          $report = Get-Content p6-windows-smoke\p6-validation-report.json -Raw | ConvertFrom-Json
          if (-not $report.all_passed) { throw 'Windows P6 smoke report failed.' }
          if (-not $report.fingerprints_match) { throw 'Windows P6 deterministic fingerprint mismatch.' }
          if ($report.first_run.config.cold_population -ne 1000000) { throw 'Cold population was not materialized.' }

      - name: Assemble manual acceptance package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\p6_manual_validation.exe dist\p6_manual_validation.exe
          Copy-Item docs\visual-acceptance\p6-simulation-scale-checklist.md dist\p6-simulation-scale-checklist.md
          Copy-Item scripts\collect_p6_machine_info.ps1 dist\collect_p6_machine_info.ps1
          $trace = Get-ChildItem evidence -Recurse -Filter p6-simulation-scale-trace.json | Select-Object -First 1
          if ($null -eq $trace) { throw 'P6 scale trace was not found.' }
          Copy-Item $trace.FullName dist\p6-simulation-scale-trace.json
          Copy-Item p6-windows-smoke\p6-validation-report.json dist\p6-windows-smoke-report.json
          Copy-Item p6-windows-smoke\p6-tier-transition.json dist\p6-windows-tier-transition.json
          @"
          # P6 模拟分级与百万持久人口人工验收包

          Validated source: ${{ github.event.pull_request.head.sha || github.sha }}
          Workflow run: $env:GITHUB_RUN_ID

          ## 运行

          1. 完整解压，不要在 ZIP 中运行。
          2. 在解压目录打开 PowerShell。
          3. 执行：

             powershell -ExecutionPolicy Bypass -File .\collect_p6_machine_info.ps1
             .\p6_manual_validation.exe

          4. 程序会实际创建一百万 Cold、10,000 Warm 和 300 Hot 人物，并执行两次完整确定性运行。
          5. 每完成一项检查会暂停；对照 p6-simulation-scale-checklist.md 后按 Enter。
          6. 完成后保留 p6-data、p6-machine-info.txt 和控制台录屏。

          ## 自动复跑

          .\p6_manual_validation.exe --auto --data-dir p6-data-auto
          "@ | Set-Content -Encoding UTF8 dist\RUN.md

      - name: Upload Windows manual acceptance package
        uses: actions/upload-artifact@v4
        with:
          name: p6-simulation-scale-manual-validation-windows-x64
          path: dist
          if-no-files-found: error
          retention-days: 30
