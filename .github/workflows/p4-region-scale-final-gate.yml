name: p4-region-scale-final-gate

on:
  push:
    branches:
      - agent/p4-integrated-world-pipeline
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/region_scale_core/**"
      - "crates/p4_region_scale_scenario/**"
      - "apps/p4_region_scale_trace/**"
      - "apps/p4_region_scale_visual/**"
      - "docs/visual-acceptance/p4-region-scale-checklist.md"
      - "scripts/collect_p4_region_scale_machine_info.ps1"
      - ".github/workflows/p4-region-scale-final-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p4-region-scale-final-gate
  cancel-in-progress: true

jobs:
  validate:
    name: region scale, grounding and route-surface gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}

    steps:
      - name: Checkout corrected P4 branch
        uses: actions/checkout@v4
        with:
          ref: agent/p4-integrated-world-pipeline

      - name: Record source
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Bevy Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            g++ pkg-config libx11-dev libasound2-dev libudev-dev \
            libxkbcommon-x11-0 libwayland-dev libxkbcommon-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Resolve dependency lockfile
        run: cargo generate-lockfile

      - name: Static architecture checks
        run: ./scripts/run_static_checks.sh

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Complete workspace compilation
        run: cargo check --workspace --all-targets

      - name: Strict Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Engine-independent tests
        run: |
          cargo test --workspace \
            --exclude camera_routes \
            --exclude mobile_region_visual \
            --exclude building_visual \
            --exclude world_visual \
            --exclude integrated_world_visual \
            --exclude p4_region_scale_visual \
            --all-targets

      - name: Generate corrected P4 evidence
        run: |
          mkdir -p artifacts
          cargo run -p p4_region_scale_trace -- artifacts/p4-region-scale-trace.json

      - name: Build corrected Bevy application on Linux
        run: cargo build -p p4_region_scale_visual

      - name: Upload corrected automated evidence
        uses: actions/upload-artifact@v4
        with:
          name: p4-region-scale-automated-evidence
          path: artifacts/p4-region-scale-trace.json
          if-no-files-found: error
          retention-days: 30

  package:
    name: Windows x64 corrected manual acceptance package
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout corrected P4 branch
        uses: actions/checkout@v4
        with:
          ref: agent/p4-integrated-world-pipeline

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Resolve dependency lockfile
        run: cargo generate-lockfile

      - name: Download corrected evidence
        uses: actions/download-artifact@v4
        with:
          name: p4-region-scale-automated-evidence
          path: evidence

      - name: Build corrected Windows visual application
        run: cargo build -p p4_region_scale_visual

      - name: Assemble manual acceptance package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/debug/p4_region_scale_visual.exe dist/p4_region_scale_visual.exe
          Copy-Item docs/visual-acceptance/p4-region-scale-checklist.md dist/p4-region-scale-checklist.md
          Copy-Item scripts/collect_p4_region_scale_machine_info.ps1 dist/collect_p4_region_scale_machine_info.ps1
          $trace = Get-ChildItem evidence -Recurse -Filter p4-region-scale-trace.json | Select-Object -First 1
          if ($null -eq $trace) { throw "Corrected P4 trace was not found." }
          Copy-Item $trace.FullName dist/p4-region-scale-trace.json
          @"
          # P4 地区级物化修正版人工验收包

          本包专门复验此前失败的三个阻塞项：

          - AtlasCell 与局部实景的地区级尺度；
          - 建筑地形落位和基础；
          - 路线贴地、桥梁和垂向穿模门禁。

          Validated source: ${{ needs.validate.outputs.source_sha }}
          Workflow run: $env:GITHUB_RUN_ID

          ## 运行

          1. 完整解压本包。
          2. 在目录中打开 PowerShell。
          3. 执行：

             powershell -ExecutionPolicy Bypass -File .\collect_p4_region_scale_machine_info.ps1
             .\p4_region_scale_visual.exe

          4. 按 p4-region-scale-checklist.md 完成完整验收。

          ## 操作

          - M：Atlas / 当前地区局部总览
          - Tab：Atlas 图层
          - Q / E：选择地区
          - Enter：激活所选地区
          - 1 / 2 / 3：跨地区路线
          - Space：暂停 / 继续
          - V：切换观察侧
          - L：建筑 LOD
          - N：邻区代理
          - G：建筑基础
          - H：当前地区边界
          - T：路线显示
          - A / D 或左右键：局部环绕
          - 上下键：局部总览高度
          - R：重置
          "@ | Set-Content -Encoding UTF8 dist/RUN.md

      - name: Upload corrected Windows package
        uses: actions/upload-artifact@v4
        with:
          name: p4-region-scale-materialization-windows-x64
          path: dist
          if-no-files-found: error
          retention-days: 30
