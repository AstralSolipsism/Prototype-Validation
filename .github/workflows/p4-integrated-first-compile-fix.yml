name: p4-integrated-first-compile-fix

on:
  push:
    branches:
      - agent/p4-integrated-world-pipeline
    paths:
      - .github/workflows/p4-integrated-first-compile-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p4-integrated-world-pipeline

      - name: Apply first compile fixes
        shell: python
        run: |
          from pathlib import Path

          terrain = Path("crates/integrated_world_core/src/terrain.rs")
          text = terrain.read_text(encoding="utf-8")
          old = "        let mut downstream = None;\n"
          new = "        let mut downstream: Option<usize> = None;\n"
          if old not in text:
              raise SystemExit("terrain downstream anchor not found")
          terrain.write_text(text.replace(old, new, 1), encoding="utf-8")

          history = Path("crates/integrated_world_core/src/history.rs")
          text = history.read_text(encoding="utf-8")
          old = "pub fn apply_history_to_atlas(\n    atlas: &mut WorldAtlasManifest,\n    history: &HistoryLedger,\n) -> Result<(), serde_json::Error> {\n    for cell in &mut atlas.cells {\n"
          new = "pub fn apply_history_to_atlas(\n    atlas: &mut WorldAtlasManifest,\n    history: &HistoryLedger,\n) -> Result<(), serde_json::Error> {\n    let cell_radius_m = atlas.cell_radius_m;\n    for cell in &mut atlas.cells {\n"
          if old not in text:
              raise SystemExit("history function anchor not found")
          text = text.replace(old, new, 1)
          text = text.replace(
              "cell_at_position(cell.coord, atlas.cell_radius_m, event.location.xz())",
              "cell_at_position(cell.coord, cell_radius_m, event.location.xz())",
          )
          history.write_text(text, encoding="utf-8")

          validate = Path("crates/integrated_world_core/src/validate.rs")
          text = validate.read_text(encoding="utf-8")
          text = text.replace(
              "use world_generation_core::{BoundaryKey, HexCoord, WorldManifest};",
              "use world_generation_core::{HexCoord, WorldManifest};",
          )
          text = text.replace(
              "use world_ids::{EntityId, EventId};",
              "use world_ids::EntityId;",
          )
          validate.write_text(text, encoding="utf-8")

      - name: Install Rustfmt
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Format and commit
        shell: bash
        run: |
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p4-integrated-first-compile-fix.yml
          git add crates/integrated_world_core/src/terrain.rs crates/integrated_world_core/src/history.rs crates/integrated_world_core/src/validate.rs
          git commit -m "Fix initial integrated P4 compile errors"
          git push origin HEAD:agent/p4-integrated-world-pipeline

# Updating this existing workflow file deliberately triggers the one-shot fix job.
