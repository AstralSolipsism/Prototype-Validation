name: p3-fast-package-run

on:
  push:
    branches:
      - agent/p3-fast-package
    paths:
      - .github/workflows/p3-fast-package-run.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build traceable P3 Windows validation package
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout packaging branch
        uses: actions/checkout@v4
        with:
          ref: agent/p3-fast-package

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build P3 visual prototype without release LTO
        run: cargo build --locked -p building_visual

      - name: Assemble validation package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/debug/building_visual.exe dist/building_visual.exe
          Copy-Item docs/visual-acceptance/p3-checklist.md dist/p3-checklist.md
          Copy-Item scripts/collect_p3_machine_info.ps1 dist/collect_p3_machine_info.ps1
          @"
          # P3 Windows 快速视觉验证包

          该程序为 Debug 构建，只用于功能与空间正确性验收，不用于最终性能结论。

          1. powershell -ExecutionPolicy Bypass -File .\collect_p3_machine_info.ps1
          2. .\building_visual.exe
          3. 按 p3-checklist.md 完成检查。

          操作：M 表现模式；X 剖视；W 加/减窗；O 移动平台；A/D 环绕；上下键调整高度；R 重置。
          "@ | Set-Content -Encoding UTF8 dist/RUN.md

      - name: Upload validation package
        uses: actions/upload-artifact@v4
        with:
          name: p3-semantic-building-windows-x64-fast
          path: dist
          if-no-files-found: error
          retention-days: 30

      - name: Record successful package build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path docs/evidence | Out-Null
          @"
          # P3 Windows 快速验证包已生成

          Workflow run: $env:GITHUB_RUN_ID
          Source commit: $env:GITHUB_SHA
          Artifact: p3-semantic-building-windows-x64-fast
          Build profile: debug
          Purpose: P3 semantic building GPU validation only
          "@ | Set-Content -Encoding UTF8 docs/evidence/p3-fast-package-ready.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evidence/p3-fast-package-ready.md
          git commit -m "Record P3 Windows validation package" 
          git push origin HEAD:agent/p3-fast-package
