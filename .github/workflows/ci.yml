name: p4-integrated-final-gate

on:
  push:
    branches:
      - agent/p4-integrated-world-pipeline
    paths-ignore:
      - docs/evidence/p4-integrated-final-gate.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p4-integrated-final-gate
  cancel-in-progress: true

env:
  INTEGRATED_BRANCH: agent/p4-integrated-world-pipeline

jobs:
  validate:
    name: architecture, Rust, deterministic evidence and Bevy build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      gate_status: ${{ steps.gate.outputs.status }}

    steps:
      - name: Checkout integrated branch with history
        uses: actions/checkout@v4
        with:
          ref: ${{ env.INTEGRATED_BRANCH }}
          fetch-depth: 0

      - name: Record workflow identity before long-running gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/evidence
          {
            echo '# P4 integrated final automated gate'
            echo
            echo 'Result: **IN_PROGRESS**'
            echo
            echo "Workflow run: ${GITHUB_RUN_ID}"
            echo "Starting source: $(git rev-parse HEAD)"
            echo "Branch: ${INTEGRATED_BRANCH}"
          } > docs/evidence/p4-integrated-final-gate.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evidence/p4-integrated-final-gate.md
          if ! git diff --cached --quiet; then
            git commit -m "Record integrated P4 final gate start"
            git push origin "HEAD:${INTEGRATED_BRANCH}"
          fi

      - name: Install Bevy Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            g++ pkg-config libx11-dev libasound2-dev libudev-dev \
            libxkbcommon-x11-0 libwayland-dev libxkbcommon-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Apply deterministic source finalizer
        run: python scripts/finalize_p4_integrated.py

      - name: Remove superseded one-shot workflows
        shell: bash
        run: |
          rm -f \
            .github/workflows/p4-integrated-clippy-fix.yml \
            .github/workflows/p4-integrated-core-diagnostic.yml

      - name: Format, resolve lockfile and persist source changes
        id: source
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo generate-lockfile
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Finalize integrated P4 automated gate fixes"
            git push origin "HEAD:${INTEGRATED_BRANCH}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run complete automated gate and retain diagnostics
        id: gate
        shell: bash
        run: |
          set +e
          mkdir -p artifacts docs/evidence
          (
            set -euo pipefail
            echo '## Static preproduction checks'
            ./scripts/run_static_checks.sh
            echo '## Formatting'
            cargo fmt --all -- --check
            echo '## Dependency lockfile'
            test -f Cargo.lock
            echo '## Complete workspace cargo check'
            cargo check --workspace --all-targets --locked
            echo '## Complete workspace strict Clippy'
            cargo clippy --workspace --all-targets --locked -- -D warnings
            echo '## Engine-independent tests and headless applications'
            cargo test --workspace \
              --exclude camera_routes \
              --exclude mobile_region_visual \
              --exclude building_visual \
              --exclude world_visual \
              --exclude integrated_world_visual \
              --all-targets --locked
            echo '## P1 headless evidence'
            cargo run --locked -p camera_trace -- artifacts/p1-camera-trace.json
            echo '## P2 headless evidence'
            cargo run --locked -p p2_reference_frame_trace -- artifacts/p2-reference-frame-trace.json
            echo '## P3 headless evidence'
            cargo run --locked -p p3_building_trace -- artifacts/p3-building-trace.json
            echo '## P4A headless evidence'
            cargo run --locked -p p4_world_trace -- artifacts/p4-world-trace.json
            echo '## Integrated P4 headless evidence'
            cargo run --locked -p p4_integrated_trace -- artifacts/p4-integrated-world-trace.json
            echo '## Integrated Bevy Linux build'
            cargo build --locked -p integrated_world_visual
          ) 2>&1 | tee artifacts/p4-integrated-final-gate.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 0 ]; then result=PASS; else result=FAIL; fi
          {
            echo '# P4 integrated final automated gate'
            echo
            echo "Result: **${result}**"
            echo
            echo "Workflow run: ${GITHUB_RUN_ID}"
            echo "Validated source: ${{ steps.source.outputs.sha }}"
            echo "Branch: ${INTEGRATED_BRANCH}"
            echo
            if [ "$status" -eq 0 ]; then
              echo '## Passed gates'
              echo
              echo '- static architecture and prototype-state checks'
              echo '- formatting and committed dependency lockfile'
              echo '- complete workspace compilation including Bevy applications'
              echo '- complete workspace strict Clippy'
              echo '- engine-independent unit and integration tests'
              echo '- P1, P2, P3, P4A and integrated P4 deterministic traces'
              echo '- integrated Bevy visual application Linux build'
              echo
              echo 'The Windows x64 package job may now run from the same workflow.'
            else
              echo '## Failure summary'
              echo
              echo '```text'
              grep -E 'error(\[E[0-9]+\])?:|panicked at|FAILED|failed checks|Validation\(' \
                artifacts/p4-integrated-final-gate.log | tail -n 180 || true
              echo '```'
              echo
              echo '## Diagnostic tail'
              echo
              echo '```text'
              tail -n 240 artifacts/p4-integrated-final-gate.log
              echo '```'
            fi
          } > docs/evidence/p4-integrated-final-gate.md
          exit 0

      - name: Upload automated evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p4-integrated-automated-evidence
          path: |
            artifacts/p1-camera-trace.json
            artifacts/p2-reference-frame-trace.json
            artifacts/p3-building-trace.json
            artifacts/p4-world-trace.json
            artifacts/p4-integrated-world-trace.json
            artifacts/p4-integrated-final-gate.log
            docs/evidence/p4-integrated-final-gate.md
          if-no-files-found: warn
          retention-days: 30

      - name: Persist final gate result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evidence/p4-integrated-final-gate.md
          if ! git diff --cached --quiet; then
            git commit -m "Record integrated P4 final gate result"
            git push origin "HEAD:${INTEGRATED_BRANCH}"
          fi

      - name: Fail after diagnostics are persisted
        if: steps.gate.outputs.status != '0'
        run: exit 1

  package:
    name: Windows x64 final manual acceptance package
    needs: validate
    if: needs.validate.outputs.gate_status == '0'
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout validated integrated branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.INTEGRATED_BRANCH }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Download automated evidence
        uses: actions/download-artifact@v4
        with:
          name: p4-integrated-automated-evidence
          path: evidence

      - name: Build integrated Windows visual application
        run: cargo build --locked -p integrated_world_visual

      - name: Assemble final manual acceptance package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/debug/integrated_world_visual.exe dist/integrated_world_visual.exe
          Copy-Item docs/visual-acceptance/p4-integrated-checklist.md dist/p4-integrated-checklist.md
          Copy-Item scripts/collect_p4_integrated_machine_info.ps1 dist/collect_p4_integrated_machine_info.ps1
          $trace = Get-ChildItem evidence -Recurse -Filter p4-integrated-world-trace.json | Select-Object -First 1
          if ($null -eq $trace) { throw 'Integrated P4 trace was not found in downloaded evidence.' }
          Copy-Item $trace.FullName dist/p4-integrated-world-trace.json
          @"
          # P4 Atlas 到卷轴世界综合人工验收包

          本包用于 P4 最终端到端技术验收，不代表正式美术、内容规模或最终性能。

          Validated source: ${{ needs.validate.outputs.source_sha }}
          Workflow run: $env:GITHUB_RUN_ID

          ## 运行

          1. 解压整个压缩包，不要直接在 ZIP 内运行。
          2. 在解压目录打开 PowerShell。
          3. 执行：

             powershell -ExecutionPolicy Bypass -File .\collect_p4_integrated_machine_info.ps1
             .\integrated_world_visual.exe

          4. 按 p4-integrated-checklist.md 完成完整连续验收。

          ## 操作

          - M：Atlas / 局部世界切换
          - Tab：切换 Atlas 图层
          - Q / E：选择地块
          - Enter：进入已物化地块
          - 1 / 2 / 3：选择路线并开始卷轴旅行
          - Space：暂停 / 继续
          - V：切换观察侧
          - L：建筑完整结构 / 外壳 / Massing
          - B：历史图层
          - C：等高线
          - H：Atlas 边界
          - T：路线显示
          - A / D 或左右键：局部总览环绕
          - 上下键：调整总览高度
          - R：重置
          "@ | Set-Content -Encoding UTF8 dist/RUN.md

      - name: Upload final Windows package
        uses: actions/upload-artifact@v4
        with:
          name: p4-integrated-atlas-to-scroll-windows-x64
          path: dist
          if-no-files-found: error
          retention-days: 30
