name: p7-bootstrap-pr

on:
  pull_request:
    branches:
      - agent/p6-simulation-tiers-scale
    paths:
      - '.p7-bootstrap/**'
      - '.github/workflows/p7-bootstrap-pr.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Reassemble and verify P7 source archive
        shell: bash
        run: |
          test "$(find .p7-bootstrap -maxdepth 1 -type f -name 'chunk-*' | wc -l)" -eq 10
          cat .p7-bootstrap/chunk-* > /tmp/p7-overlay.b64
          echo '9d10170f5f96c75b5d8d97ec65ffe71ec6168fca8b45115ee150a64ed7019daa  /tmp/p7-overlay.b64' | sha256sum --check -
          base64 --decode /tmp/p7-overlay.b64 > /tmp/p7-overlay.tar.gz
          echo 'e0c968d839f586b20e754b4c8c8ca00e05a43128b35b4c7df09fb2aada8e99f0  /tmp/p7-overlay.tar.gz' | sha256sum --check -
          tar -tzf /tmp/p7-overlay.tar.gz

      - name: Materialize non-workflow P7 source
        shell: bash
        run: |
          tar -xzf /tmp/p7-overlay.tar.gz
          test -f crates/region_authority_core/src/lib.rs
          test -f crates/p7_validation_harness/src/lib.rs
          test -f apps/p7_manual_validation/src/main.rs
          test -f .github/workflows/p7-pr-validation.yml
          rm -f .github/workflows/p7-pr-validation.yml
          rm -rf .p7-bootstrap

      - name: Commit ordinary P7 source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement P7 interest and region authority validation"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
