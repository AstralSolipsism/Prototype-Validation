name: p4-integrated-core-diagnostic

on:
  push:
    branches:
      - agent/p4-integrated-world-pipeline
    paths:
      - .github/workflows/p4-integrated-core-diagnostic.yml

permissions:
  contents: write

concurrency:
  group: p4-integrated-core-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    name: validate and archive integrated P4 core
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout integrated branch
        uses: actions/checkout@v4
        with:
          ref: agent/p4-integrated-world-pipeline
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Persist known source cleanup
        shell: python
        run: |
          from pathlib import Path

          atlas = Path("crates/integrated_world_core/src/atlas.rs")
          text = atlas.read_text(encoding="utf-8")
          text = text.replace(
              "    let settlement_cell = manifest\n        .cell(settlement.cell)\n        .expect(\"settlement cell exists\");\n",
              "",
              1,
          )
          old = """        if let Some(cell) = manifest.cells.iter().min_by(|left, right| {
            left.center_world
                .xz()
                .distance_squared(point.xz())
                .total_cmp(&right.center_world.xz().distance_squared(point.xz()))
        }) {
            if cell.center_world.xz().distance(point.xz()) <= manifest.cell_radius_m * 1.35 {
                touched.insert(cell.coord);
            }
        }
"""
          new = """        if let Some(cell) = manifest.cells.iter().min_by(|left, right| {
            left.center_world
                .xz()
                .distance_squared(point.xz())
                .total_cmp(&right.center_world.xz().distance_squared(point.xz()))
        }) && cell.center_world.xz().distance(point.xz()) <= manifest.cell_radius_m * 1.35
        {
            touched.insert(cell.coord);
        }
"""
          if old in text:
              text = text.replace(old, new, 1)
          atlas.write_text(text, encoding="utf-8")

          traversal = Path("crates/integrated_world_core/src/traversal.rs")
          text = traversal.read_text(encoding="utf-8")
          text = text.replace(
              "fn nearest_sample<'a>(grid: &'a TerrainGrid, point: DVec2) -> &'a TerrainSample {",
              "fn nearest_sample(grid: &TerrainGrid, point: DVec2) -> &TerrainSample {",
              1,
          )
          traversal.write_text(text, encoding="utf-8")

          lib = Path("crates/integrated_world_core/src/lib.rs")
          text = lib.read_text(encoding="utf-8")
          text = text.replace(
              "#![allow(unused_variables, clippy::collapsible_if, clippy::needless_lifetimes)]\n",
              "",
              1,
          )
          lib.write_text(text, encoding="utf-8")

          Path(".github/workflows/p4-integrated-clippy-fix.yml").unlink(missing_ok=True)

      - name: Run integrated core gates and capture diagnostics
        id: gates
        shell: bash
        run: |
          set +e
          mkdir -p artifacts docs/evidence
          cargo fmt --all
          {
            echo '## cargo check'
            cargo check --locked -p integrated_world_core -p p4_integrated_scenario -p p4_integrated_trace --all-targets
            echo '## cargo clippy'
            cargo clippy --locked -p integrated_world_core -p p4_integrated_scenario -p p4_integrated_trace --all-targets -- -D warnings
            echo '## cargo test'
            cargo test --locked -p integrated_world_core -p p4_integrated_scenario -p p4_integrated_trace --all-targets
            echo '## integrated trace'
            cargo run --locked -p p4_integrated_trace -- artifacts/p4-integrated-world-trace.json
          } > artifacts/p4-integrated-core-diagnostic.log 2>&1
          status=$?
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 0 ]; then
            result="PASS"
          else
            result="FAIL"
          fi
          {
            echo '# P4 integrated core diagnostic'
            echo
            echo "Result: **${result}**"
            echo
            echo "Workflow run: ${GITHUB_RUN_ID}"
            echo "Source commit: ${GITHUB_SHA}"
            echo
            echo '## Diagnostic tail'
            echo
            echo '```text'
            tail -n 220 artifacts/p4-integrated-core-diagnostic.log
            echo '```'
          } > docs/evidence/p4-integrated-core-diagnostic.md
          exit 0

      - name: Remove one-shot workflow and commit evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p4-integrated-core-diagnostic.yml
          git add -A
          git commit -m "Archive integrated P4 core diagnostic"
          git pull --rebase origin agent/p4-integrated-world-pipeline
          git push origin HEAD:agent/p4-integrated-world-pipeline

      - name: Fail the workflow after evidence is persisted
        if: steps.gates.outputs.status != '0'
        run: exit 1
