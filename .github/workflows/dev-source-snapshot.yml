name: dev-source-snapshot

on:
  push:
    branches:
      - agent/p4-integrated-world-pipeline
  pull_request:
    branches:
      - agent/p4-deterministic-world-generation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p4-integrated-world-pipeline
      - name: Create source archive
        run: |
          tar --exclude=.git --exclude=target --exclude=artifacts -czf prototype-validation-source.tar.gz .
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: prototype-validation-source
          path: prototype-validation-source.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Record source snapshot run
        shell: bash
        run: |
          mkdir -p docs/evidence
          cat > docs/evidence/dev-source-snapshot.md <<EOF
          # Development source snapshot

          Workflow run: ${GITHUB_RUN_ID}
          Source commit: ${GITHUB_SHA}
          Artifact: prototype-validation-source
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evidence/dev-source-snapshot.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record development source snapshot"
          git push origin HEAD:agent/p4-integrated-world-pipeline
