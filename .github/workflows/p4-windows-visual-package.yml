name: p4-integrated-remote-gate

on:
  push:
    branches:
      - agent/p4-deterministic-world-generation
    paths:
      - .github/workflows/p4-windows-visual-package.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p4-integrated-remote-gate
  cancel-in-progress: false

jobs:
  validate:
    name: validate integrated P4 branch
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout integrated P4 branch
        uses: actions/checkout@v4
        with:
          ref: agent/p4-integrated-world-pipeline
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Bevy Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            g++ pkg-config libx11-dev libasound2-dev libudev-dev \
            libxkbcommon-x11-0 libwayland-dev libxkbcommon-dev

      - name: Apply source cleanup
        shell: python
        run: |
          from pathlib import Path

          atlas = Path("crates/integrated_world_core/src/atlas.rs")
          text = atlas.read_text(encoding="utf-8")
          text = text.replace(
              "    let settlement_cell = manifest\n        .cell(settlement.cell)\n        .expect(\"settlement cell exists\");\n",
              "",
              1,
          )
          old = """        if let Some(cell) = manifest.cells.iter().min_by(|left, right| {
            left.center_world
                .xz()
                .distance_squared(point.xz())
                .total_cmp(&right.center_world.xz().distance_squared(point.xz()))
        }) {
            if cell.center_world.xz().distance(point.xz()) <= manifest.cell_radius_m * 1.35 {
                touched.insert(cell.coord);
            }
        }
"""
          new = """        if let Some(cell) = manifest.cells.iter().min_by(|left, right| {
            left.center_world
                .xz()
                .distance_squared(point.xz())
                .total_cmp(&right.center_world.xz().distance_squared(point.xz()))
        }) && cell.center_world.xz().distance(point.xz()) <= manifest.cell_radius_m * 1.35
        {
            touched.insert(cell.coord);
        }
"""
          if old in text:
              text = text.replace(old, new, 1)
          atlas.write_text(text, encoding="utf-8")

          traversal = Path("crates/integrated_world_core/src/traversal.rs")
          text = traversal.read_text(encoding="utf-8")
          text = text.replace(
              "fn nearest_sample<'a>(grid: &'a TerrainGrid, point: DVec2) -> &'a TerrainSample {",
              "fn nearest_sample(grid: &TerrainGrid, point: DVec2) -> &TerrainSample {",
              1,
          )
          traversal.write_text(text, encoding="utf-8")

          lib = Path("crates/integrated_world_core/src/lib.rs")
          text = lib.read_text(encoding="utf-8")
          text = text.replace(
              "#![allow(unused_variables, clippy::collapsible_if, clippy::needless_lifetimes)]\n",
              "",
              1,
          )
          lib.write_text(text, encoding="utf-8")

      - name: Run integrated gates and capture evidence
        id: gates
        shell: bash
        run: |
          set +e
          mkdir -p artifacts docs/evidence
          cargo fmt --all
          {
            echo '## static architecture'
            ./scripts/run_static_checks.sh
            echo '## cargo check'
            cargo check --workspace --all-targets --locked
            echo '## cargo clippy'
            cargo clippy --workspace --all-targets --locked -- -D warnings
            echo '## engine-independent tests'
            cargo test --workspace \
              --exclude camera_routes \
              --exclude mobile_region_visual \
              --exclude building_visual \
              --exclude world_visual \
              --exclude integrated_world_visual \
              --all-targets --locked
            echo '## integrated trace'
            cargo run --locked -p p4_integrated_trace -- artifacts/p4-integrated-world-trace.json
          } > artifacts/p4-integrated-remote-gate.log 2>&1
          status=$?
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          result=FAIL
          [ "$status" -eq 0 ] && result=PASS
          {
            echo '# P4 integrated remote gate'
            echo
            echo "Result: **${result}**"
            echo
            echo "Workflow run: ${GITHUB_RUN_ID}"
            echo "Integrated source commit: $(git rev-parse HEAD)"
            echo
            if [ -f artifacts/p4-integrated-world-trace.json ]; then
              echo '## Integrated trace'
              echo
              echo '```json'
              cat artifacts/p4-integrated-world-trace.json
              echo '```'
            else
              echo '## Failure summary'
              echo
              echo '```text'
              grep -E 'error(\[E[0-9]+\])?:|panicked at|FAILED|failed checks|Validation\(' artifacts/p4-integrated-remote-gate.log | tail -n 200 || true
              echo '```'
              echo
              echo '## Diagnostic tail'
              echo
              echo '```text'
              tail -n 260 artifacts/p4-integrated-remote-gate.log
              echo '```'
            fi
          } > docs/evidence/p4-integrated-remote-gate.md
          exit 0

      - name: Commit source cleanup and evidence to integrated branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/integrated_world_core apps/integrated_world_visual docs/evidence/p4-integrated-remote-gate.md
          if git diff --cached --quiet; then
            echo "Integrated branch already contains current source and evidence."
            exit 0
          fi
          git commit -m "Persist integrated P4 remote gate results"
          git pull --rebase origin agent/p4-integrated-world-pipeline
          git push origin HEAD:agent/p4-integrated-world-pipeline

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p4-integrated-remote-gate
          path: |
            artifacts/p4-integrated-remote-gate.log
            artifacts/p4-integrated-world-trace.json
          if-no-files-found: warn
          retention-days: 7

      - name: Fail after evidence is persisted when gates fail
        if: steps.gates.outputs.status != '0'
        run: exit 1
