name: p3-ci-cleanup

on:
  push:
    branches:
      - agent/p3-semantic-building-compiler

permissions:
  contents: write

concurrency:
  group: p3-ci-cleanup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    name: remove P3 strict-lint leftovers
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/p3-semantic-building-compiler

      - name: Patch exact lint findings
        shell: python
        run: |
          from pathlib import Path

          compile_path = Path("crates/building_core/src/compile.rs")
          compile_text = compile_path.read_text(encoding="utf-8")
          compile_text = compile_text.replace(
              "use world_ids::{BuildingLevelId, OpeningId, RoomId, WallId};",
              "use world_ids::RoomId;",
          )
          compile_path.write_text(compile_text, encoding="utf-8")

          validate_path = Path("crates/building_core/src/validate.rs")
          validate_text = validate_path.read_text(encoding="utf-8")
          for exact in (
              "    pub level_indices: BTreeMap<i16, BuildingLevelId>,\n",
              "    let mut level_indices = BTreeMap::new();\n",
              "        level_indices.entry(level.index).or_insert(level.id);\n",
              "        level_indices,\n",
          ):
              validate_text = validate_text.replace(exact, "")
          validate_path.write_text(validate_text, encoding="utf-8")

      - name: Install Rustfmt
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Format changed files
        run: cargo fmt --all

      - name: Commit cleanup when changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/building_core/src/compile.rs crates/building_core/src/validate.rs
          if git diff --cached --quiet; then
            echo "Strict-lint cleanup is already applied."
            exit 0
          fi
          git commit -m "Clean P3 strict lint findings"
          git push origin HEAD:agent/p3-semantic-building-compiler
