name: p4-region-scale-corrected-final-gate

on:
  push:
    branches:
      - agent/p4-integrated-world-pipeline
    paths-ignore:
      - docs/evidence/p4-integrated-final-gate.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p4-region-scale-corrected-final-gate
  cancel-in-progress: true

env:
  INTEGRATED_BRANCH: agent/p4-integrated-world-pipeline

jobs:
  validate:
    name: architecture, region scale, grounding, route surfaces and Bevy build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      gate_status: ${{ steps.gate.outputs.status }}

    steps:
      - name: Checkout corrected P4 branch with history
        uses: actions/checkout@v4
        with:
          ref: ${{ env.INTEGRATED_BRANCH }}
          fetch-depth: 0

      - name: Record workflow identity before long-running gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/evidence
          {
            echo '# P4 corrected region-scale final automated gate'
            echo
            echo 'Result: **IN_PROGRESS**'
            echo
            echo "Workflow run: ${GITHUB_RUN_ID}"
            echo "Starting source: $(git rev-parse HEAD)"
            echo "Branch: ${INTEGRATED_BRANCH}"
          } > docs/evidence/p4-integrated-final-gate.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evidence/p4-integrated-final-gate.md
          if ! git diff --cached --quiet; then
            git commit -m "Record corrected P4 final gate start"
            git push origin "HEAD:${INTEGRATED_BRANCH}"
          fi

      - name: Install Bevy Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            g++ pkg-config libx11-dev libasound2-dev libudev-dev \
            libxkbcommon-x11-0 libwayland-dev libxkbcommon-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Apply deterministic source finalizer
        run: python scripts/finalize_p4_integrated.py

      - name: Remove superseded one-shot workflows
        shell: bash
        run: |
          rm -f \
            .github/workflows/p4-integrated-clippy-fix.yml \
            .github/workflows/p4-integrated-core-diagnostic.yml

      - name: Format, resolve lockfile and persist source changes
        id: source
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo generate-lockfile
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Finalize corrected P4 automated gate fixes"
            git push origin "HEAD:${INTEGRATED_BRANCH}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run complete automated gate and retain diagnostics
        id: gate
        shell: bash
        run: |
          set +e
          mkdir -p artifacts docs/evidence
          (
            set -euo pipefail
            echo '## Static preproduction checks'
            ./scripts/run_static_checks.sh
            echo '## Formatting'
            cargo fmt --all -- --check
            echo '## Dependency lockfile'
            test -f Cargo.lock
            echo '## Complete workspace cargo check'
            cargo check --workspace --all-targets --locked
            echo '## Complete workspace strict Clippy'
            cargo clippy --workspace --all-targets --locked -- -D warnings
            echo '## Engine-independent tests and headless applications'
            cargo test --workspace \
              --exclude camera_routes \
              --exclude mobile_region_visual \
              --exclude building_visual \
              --exclude world_visual \
              --exclude integrated_world_visual \
              --exclude p4_region_scale_visual \
              --all-targets --locked
            echo '## P1 headless evidence'
            cargo run --locked -p camera_trace -- artifacts/p1-camera-trace.json
            echo '## P2 headless evidence'
            cargo run --locked -p p2_reference_frame_trace -- artifacts/p2-reference-frame-trace.json
            echo '## P3 headless evidence'
            cargo run --locked -p p3_building_trace -- artifacts/p3-building-trace.json
            echo '## P4A headless evidence'
            cargo run --locked -p p4_world_trace -- artifacts/p4-world-trace.json
            echo '## Previous integrated P4 regression evidence'
            cargo run --locked -p p4_integrated_trace -- artifacts/p4-integrated-world-trace.json
            echo '## Corrected region-scale P4 evidence'
            cargo run --locked -p p4_region_scale_trace -- artifacts/p4-region-scale-trace.json
            echo '## Previous integrated Bevy regression build'
            cargo build --locked -p integrated_world_visual
            echo '## Corrected region-scale Bevy Linux build'
            cargo build --locked -p p4_region_scale_visual
          ) 2>&1 | tee artifacts/p4-integrated-final-gate.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 0 ]; then result=PASS; else result=FAIL; fi
          {
            echo '# P4 corrected region-scale final automated gate'
            echo
            echo "Result: **${result}**"
            echo
            echo "Workflow run: ${GITHUB_RUN_ID}"
            echo "Validated source: ${{ steps.source.outputs.sha }}"
            echo "Branch: ${INTEGRATED_BRANCH}"
            echo
            if [ "$status" -eq 0 ]; then
              echo '## Passed gates'
              echo
              echo '- static architecture and prototype-state checks'
              echo '- formatting and committed dependency lockfile'
              echo '- complete workspace compilation and strict Clippy'
              echo '- engine-independent unit and integration tests'
              echo '- P0 through P4A regression traces'
              echo '- corrected 4 km AtlasCell and 250 m TerrainTile separation'
              echo '- selected-cell full materialization plus neighbor proxies'
              echo '- deterministic shared boundary contracts'
              echo '- explicit building grounding and foundations'
              echo '- surface-conforming route and bridge semantics'
              echo '- previous and corrected Bevy Linux builds'
              echo
              echo 'The corrected Windows x64 package job may now run.'
            else
              echo '## Failure summary'
              echo
              echo '```text'
              grep -E 'error(\[E[0-9]+\])?:|panicked at|FAILED|failed checks|Validation\(' \
                artifacts/p4-integrated-final-gate.log | tail -n 180 || true
              echo '```'
              echo
              echo '## Diagnostic tail'
              echo
              echo '```text'
              tail -n 260 artifacts/p4-integrated-final-gate.log
              echo '```'
            fi
          } > docs/evidence/p4-integrated-final-gate.md
          exit 0

      - name: Upload automated evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p4-region-scale-automated-evidence
          path: |
            artifacts/p1-camera-trace.json
            artifacts/p2-reference-frame-trace.json
            artifacts/p3-building-trace.json
            artifacts/p4-world-trace.json
            artifacts/p4-integrated-world-trace.json
            artifacts/p4-region-scale-trace.json
            artifacts/p4-integrated-final-gate.log
            docs/evidence/p4-integrated-final-gate.md
          if-no-files-found: warn
          retention-days: 30

      - name: Persist final gate result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evidence/p4-integrated-final-gate.md
          if ! git diff --cached --quiet; then
            git commit -m "Record corrected P4 final gate result"
            git push origin "HEAD:${INTEGRATED_BRANCH}"
          fi

      - name: Fail after diagnostics are persisted
        if: steps.gate.outputs.status != '0'
        run: exit 1

  package:
    name: Windows x64 corrected region-scale manual acceptance package
    needs: validate
    if: needs.validate.outputs.gate_status == '0'
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout validated corrected P4 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.INTEGRATED_BRANCH }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Download corrected automated evidence
        uses: actions/download-artifact@v4
        with:
          name: p4-region-scale-automated-evidence
          path: evidence

      - name: Build corrected Windows visual application
        run: cargo build --locked -p p4_region_scale_visual

      - name: Assemble corrected manual acceptance package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/debug/p4_region_scale_visual.exe dist/p4_region_scale_visual.exe
          Copy-Item docs/visual-acceptance/p4-region-scale-checklist.md dist/p4-region-scale-checklist.md
          Copy-Item scripts/collect_p4_region_scale_machine_info.ps1 dist/collect_p4_region_scale_machine_info.ps1
          $trace = Get-ChildItem evidence -Recurse -Filter p4-region-scale-trace.json | Select-Object -First 1
          if ($null -eq $trace) { throw 'Corrected P4 trace was not found in downloaded evidence.' }
          Copy-Item $trace.FullName dist/p4-region-scale-trace.json
          @"
          # P4 地区级物化修正版人工验收包

          本包专门复验此前失败的三个阻塞项：

          - AtlasCell 与局部实景的地区级尺度；
          - 建筑地形落位和基础；
          - 路线贴地、桥梁和垂向穿模门禁。

          Validated source: ${{ needs.validate.outputs.source_sha }}
          Workflow run: $env:GITHUB_RUN_ID

          ## 运行

          1. 完整解压本包，不要直接在 ZIP 中运行。
          2. 在目录中打开 PowerShell。
          3. 执行：

             powershell -ExecutionPolicy Bypass -File .\collect_p4_region_scale_machine_info.ps1
             .\p4_region_scale_visual.exe

          4. 按 p4-region-scale-checklist.md 完成完整验收。

          ## 操作

          - M：Atlas / 当前地区局部总览
          - Tab：Atlas 图层
          - Q / E：选择地区
          - Enter：激活所选地区
          - 1 / 2 / 3：跨地区路线
          - Space：暂停 / 继续
          - V：切换观察侧
          - L：建筑 LOD
          - N：邻区代理
          - G：建筑基础
          - H：当前地区边界
          - T：路线显示
          - A / D 或左右键：局部环绕
          - 上下键：局部总览高度
          - R：重置
          "@ | Set-Content -Encoding UTF8 dist/RUN.md

      - name: Upload corrected Windows package
        uses: actions/upload-artifact@v4
        with:
          name: p4-region-scale-materialization-windows-x64
          path: dist
          if-no-files-found: error
          retention-days: 30
