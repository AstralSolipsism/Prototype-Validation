name: p3-auto-format

on:
  push:
    branches:
      - agent/p3-semantic-building-compiler

permissions:
  contents: write

concurrency:
  group: p3-auto-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: apply rustfmt to P3 branch
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/p3-semantic-building-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Apply rustfmt
        run: cargo fmt --all

      - name: Commit formatting when changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          if git diff --cached --quiet; then
            echo "Rust sources are already formatted."
            exit 0
          fi
          git commit -m "Format P3 Rust sources"
          git push origin HEAD:agent/p3-semantic-building-compiler
