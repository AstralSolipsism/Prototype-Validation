name: p4-integrated-clippy-fix

on:
  push:
    branches:
      - agent/p4-integrated-world-pipeline
    paths:
      - .github/workflows/p4-integrated-clippy-fix.yml

permissions:
  contents: write

concurrency:
  group: p4-integrated-clippy-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p4-integrated-world-pipeline

      - name: Apply exact strict-Clippy fixes
        shell: python
        run: |
          from pathlib import Path

          atlas = Path("crates/integrated_world_core/src/atlas.rs")
          text = atlas.read_text(encoding="utf-8")
          unused = """    let settlement_cell = manifest
        .cell(settlement.cell)
        .expect("settlement cell exists");
"""
          if unused not in text:
              raise SystemExit("unused settlement cell block not found")
          text = text.replace(unused, "", 1)

          old = """        if let Some(cell) = manifest.cells.iter().min_by(|left, right| {
            left.center_world
                .xz()
                .distance_squared(point.xz())
                .total_cmp(&right.center_world.xz().distance_squared(point.xz()))
        }) {
            if cell.center_world.xz().distance(point.xz()) <= manifest.cell_radius_m * 1.35 {
                touched.insert(cell.coord);
            }
        }
"""
          new = """        if let Some(cell) = manifest.cells.iter().min_by(|left, right| {
            left.center_world
                .xz()
                .distance_squared(point.xz())
                .total_cmp(&right.center_world.xz().distance_squared(point.xz()))
        }) && cell.center_world.xz().distance(point.xz()) <= manifest.cell_radius_m * 1.35
        {
            touched.insert(cell.coord);
        }
"""
          if old not in text:
              raise SystemExit("collapsible cell selection block not found")
          atlas.write_text(text.replace(old, new, 1), encoding="utf-8")

          traversal = Path("crates/integrated_world_core/src/traversal.rs")
          text = traversal.read_text(encoding="utf-8")
          old = "fn nearest_sample<'a>(grid: &'a TerrainGrid, point: DVec2) -> &'a TerrainSample {"
          new = "fn nearest_sample(grid: &TerrainGrid, point: DVec2) -> &TerrainSample {"
          if old not in text:
              raise SystemExit("nearest_sample lifetime signature not found")
          traversal.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Install Rustfmt
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Format, rebase and commit
        shell: bash
        run: |
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p4-integrated-clippy-fix.yml
          git add crates/integrated_world_core/src/atlas.rs crates/integrated_world_core/src/traversal.rs
          git commit -m "Clean integrated P4 strict Clippy findings"
          git pull --rebase origin agent/p4-integrated-world-pipeline
          git push origin HEAD:agent/p4-integrated-world-pipeline
