name: p2-windows-visual-package

on:
  push:
    branches:
      - "agent/p2-**"
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - "apps/mobile_region_visual/**"
      - "crates/mobile_region_core/**"
      - "crates/world_math/**"
      - "docs/visual-acceptance/p2-checklist.md"
      - "scripts/collect_p2_machine_info.ps1"
      - .github/workflows/p2-windows-visual-package.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - "apps/mobile_region_visual/**"
      - "crates/mobile_region_core/**"
      - "crates/world_math/**"
      - "docs/visual-acceptance/p2-checklist.md"
      - "scripts/collect_p2_machine_info.ps1"
      - .github/workflows/p2-windows-visual-package.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p2-windows-visual-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64 P2 validation package
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Require committed dependency lockfile
        shell: pwsh
        run: |
          if (-not (Test-Path Cargo.lock)) {
            throw "Cargo.lock is missing."
          }

      - name: Build P2 visual prototype
        run: cargo build --locked -p mobile_region_visual

      - name: Assemble validation package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/debug/mobile_region_visual.exe dist/mobile_region_visual.exe
          Copy-Item docs/visual-acceptance/p2-checklist.md dist/p2-checklist.md
          Copy-Item scripts/collect_p2_machine_info.ps1 dist/collect_p2_machine_info.ps1
          @"
          # P2 Windows 视觉验证包

          1. 运行环境采集：
             powershell -ExecutionPolicy Bypass -File .\collect_p2_machine_info.ps1
          2. 启动原型：
             .\mobile_region_visual.exe
          3. 按 p2-checklist.md 完成录像和检查。

          操作：
          - Space：暂停或继续船舶运动
          - C：切换舱内窗口 / 外部剖视镜头
          - B：在世界参考系与船舶参考系之间迁移红色主体
          - P：开启或关闭客户端表现摇摆
          - R：重置航行时间

          该程序使用工作区的优化开发配置构建，以缩短技术预生产反馈周期。
          本程序只验证 P2 移动参考系和统一内外空间，不代表正式游戏画面、最终性能或船舶物理。
          "@ | Set-Content -Encoding UTF8 dist/RUN.md

      - name: Upload validated Windows package
        uses: actions/upload-artifact@v4
        with:
          name: p2-mobile-reference-frame-windows-x64
          path: dist
          if-no-files-found: error
          retention-days: 30
