name: p5-pr-validation

on:
  pull_request:
    branches:
      - agent/p4-integrated-world-pipeline
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'apps/**'
      - 'scripts/**'
      - 'docs/visual-acceptance/p5-authority-checklist.md'
      - '.github/workflows/p5-pr-validation.yml'
      - 'prototype-status.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p5-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: authoritative state, TCP, persistence, recovery and regressions
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout exact P5 source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Bevy Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            g++ pkg-config libx11-dev libasound2-dev libudev-dev \
            libxkbcommon-x11-0 libwayland-dev libxkbcommon-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Static architecture and stage checks
        run: ./scripts/run_static_checks.sh

      - name: Formatting and lockfile
        run: |
          cargo fmt --all -- --check
          test -f Cargo.lock

      - name: Complete workspace compilation
        run: cargo check --workspace --all-targets --locked

      - name: Complete workspace strict Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Engine-independent tests
        run: |
          cargo test --workspace \
            --exclude camera_routes \
            --exclude mobile_region_visual \
            --exclude building_visual \
            --exclude world_visual \
            --exclude integrated_world_visual \
            --exclude p4_region_scale_visual \
            --all-targets --locked

      - name: Generate P0-P4 regression evidence
        run: |
          mkdir -p artifacts
          cargo run --locked -p camera_trace -- artifacts/p1-camera-trace.json
          cargo run --locked -p p2_reference_frame_trace -- artifacts/p2-reference-frame-trace.json
          cargo run --locked -p p3_building_trace -- artifacts/p3-building-trace.json
          cargo run --locked -p p4_world_trace -- artifacts/p4-world-trace.json
          cargo run --locked -p p4_integrated_trace -- artifacts/p4-integrated-world-trace.json
          cargo run --locked -p p4_region_scale_trace -- artifacts/p4-region-scale-trace.json

      - name: Run P5 authoritative TCP, persistence and recovery trace
        run: cargo run --locked -p p5_authority_trace -- artifacts/p5-authority-trace.json

      - name: Run interactive executable in automatic smoke mode
        run: cargo run --locked -p p5_manual_validation -- --auto --data-dir artifacts/p5-manual-smoke

      - name: Assert P5 semantic evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('artifacts/p5-authority-trace.json').read_text(encoding='utf-8'))
          assert report['all_passed'] is True, report
          assert report['pre_crash_fingerprint'] == report['recovered_fingerprint'], report
          assert report['duplicate_receipts'] >= 2, report
          assert report['rejected_receipts'] >= 2, report
          assert report['buffered_out_of_order_commands'] >= 1, report
          assert report['journal_records'] >= 10, report

          smoke = json.loads(Path('artifacts/p5-manual-smoke/p5-validation-report.json').read_text(encoding='utf-8'))
          assert smoke['all_passed'] is True, smoke
          assert smoke['pre_crash_fingerprint'] == smoke['recovered_fingerprint'], smoke
          print('P5 semantic evidence passed.')
          PY

      - name: Build prior visual regressions and P5 manual executable
        run: |
          cargo build --locked -p camera_routes
          cargo build --locked -p mobile_region_visual
          cargo build --locked -p building_visual
          cargo build --locked -p p4_region_scale_visual
          cargo build --locked -p p5_manual_validation

      - name: Write gate summary
        run: |
          {
            echo '# P5 authoritative server automated gate'
            echo
            echo 'Result: **PASS**'
            echo
            echo "Validated source: ${{ github.event.pull_request.head.sha || github.sha }}"
            echo "Workflow run: ${GITHUB_RUN_ID}"
            echo
            echo '- typed authoritative commands and state'
            echo '- persistent idempotency and version/permission rejection'
            echo '- ordered buffering of delayed and out-of-order requests'
            echo '- real loopback TCP server with two clients'
            echo '- atomic snapshot and transactional journal'
            echo '- disconnect/reconnect and process restart recovery'
            echo '- identical pre-crash and recovered state fingerprints'
            echo '- P0 through P4 regression checks'
          } > artifacts/p5-authority-gate-summary.md

      - name: Upload P5 automated evidence
        uses: actions/upload-artifact@v4
        with:
          name: p5-authority-automated-evidence
          path: |
            artifacts/p1-camera-trace.json
            artifacts/p2-reference-frame-trace.json
            artifacts/p3-building-trace.json
            artifacts/p4-world-trace.json
            artifacts/p4-integrated-world-trace.json
            artifacts/p4-region-scale-trace.json
            artifacts/p5-authority-trace.json
            artifacts/p5-authority-trace.data/region-snapshot.json
            artifacts/p5-authority-trace.data/command-journal.ndjson
            artifacts/p5-authority-trace.data/p5-validation-report.json
            artifacts/p5-manual-smoke/region-snapshot.json
            artifacts/p5-manual-smoke/command-journal.ndjson
            artifacts/p5-manual-smoke/p5-validation-report.json
            artifacts/p5-authority-gate-summary.md
          if-no-files-found: error
          retention-days: 30

  package:
    name: Windows x64 P5 manual acceptance package
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout exact validated P5 source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Download P5 automated evidence
        uses: actions/download-artifact@v4
        with:
          name: p5-authority-automated-evidence
          path: evidence

      - name: Build P5 release executable
        run: cargo build --release --locked -p p5_manual_validation

      - name: Run Windows automatic smoke validation
        shell: pwsh
        run: |
          .\target\release\p5_manual_validation.exe --auto --data-dir p5-windows-smoke
          $report = Get-Content p5-windows-smoke\p5-validation-report.json -Raw | ConvertFrom-Json
          if (-not $report.all_passed) { throw 'Windows P5 smoke report failed.' }
          if ($report.pre_crash_fingerprint -ne $report.recovered_fingerprint) {
            throw 'Windows recovery fingerprint mismatch.'
          }

      - name: Assemble manual acceptance package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\p5_manual_validation.exe dist\p5_manual_validation.exe
          Copy-Item docs\visual-acceptance\p5-authority-checklist.md dist\p5-authority-checklist.md
          Copy-Item scripts\collect_p5_machine_info.ps1 dist\collect_p5_machine_info.ps1
          $trace = Get-ChildItem evidence -Recurse -Filter p5-authority-trace.json | Select-Object -First 1
          if ($null -eq $trace) { throw 'P5 authority trace was not found.' }
          Copy-Item $trace.FullName dist\p5-authority-trace.json
          Copy-Item p5-windows-smoke\p5-validation-report.json dist\p5-windows-smoke-report.json
          @"
          # P5 权威服务端、存档、恢复与回放人工验收包

          Validated source: ${{ github.event.pull_request.head.sha || github.sha }}
          Workflow run: $env:GITHUB_RUN_ID

          ## 运行

          1. 完整解压，不要在 ZIP 中运行。
          2. 在解压目录打开 PowerShell。
          3. 执行：

             powershell -ExecutionPolicy Bypass -File .\collect_p5_machine_info.ps1
             .\p5_manual_validation.exe

          4. 每完成一步，程序会暂停；对照 p5-authority-checklist.md 检查后按 Enter。
          5. 完成后保留 p5-data、p5-machine-info.txt 和控制台录屏。

          ## 自动复跑

          .\p5_manual_validation.exe --auto --data-dir p5-data-auto
          "@ | Set-Content -Encoding UTF8 dist\RUN.md

      - name: Upload Windows manual acceptance package
        uses: actions/upload-artifact@v4
        with:
          name: p5-authority-manual-validation-windows-x64
          path: dist
          if-no-files-found: error
          retention-days: 30
