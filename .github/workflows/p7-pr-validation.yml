name: p7-pr-validation

on:
  pull_request:
    branches:
      - agent/p6-simulation-tiers-scale
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'apps/**'
      - 'scripts/**'
      - 'docs/visual-acceptance/p7-region-authority-checklist.md'
      - '.github/workflows/p7-pr-validation.yml'
      - 'prototype-status.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p7-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: interest filtering, region authority, transfer and concurrency regressions
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout exact P7 source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Bevy Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            g++ pkg-config libx11-dev libasound2-dev libudev-dev \
            libxkbcommon-x11-0 libwayland-dev libxkbcommon-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Normalize P7 implementation status
        run: python scripts/finalize_p7.py --mode implementation

      - name: Static architecture and stage checks
        run: ./scripts/run_static_checks.sh

      - name: Normalize formatting and generate dependency lock
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo generate-lockfile
          test -f Cargo.lock

      - name: Complete workspace compilation
        run: cargo check --workspace --all-targets --locked

      - name: Complete workspace strict Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Engine-independent tests
        run: |
          cargo test --workspace \
            --exclude camera_routes \
            --exclude mobile_region_visual \
            --exclude building_visual \
            --exclude world_visual \
            --exclude integrated_world_visual \
            --exclude p4_region_scale_visual \
            --all-targets --locked

      - name: Generate P0-P6 regression evidence
        run: |
          mkdir -p artifacts
          cargo run --locked -p camera_trace -- artifacts/p1-camera-trace.json
          cargo run --locked -p p2_reference_frame_trace -- artifacts/p2-reference-frame-trace.json
          cargo run --locked -p p3_building_trace -- artifacts/p3-building-trace.json
          cargo run --locked -p p4_region_scale_trace -- artifacts/p4-region-scale-trace.json
          cargo run --locked -p p5_authority_trace -- artifacts/p5-authority-trace.json
          cargo run --release --locked -p p6_simulation_trace -- artifacts/p6-simulation-scale-trace.json

      - name: Run P7 interest and region authority trace
        run: cargo run --release --locked -p p7_region_trace -- artifacts/p7-region-authority-trace.json

      - name: Run P7 interactive executable in automatic mode
        run: cargo run --release --locked -p p7_manual_validation -- --auto --data-dir artifacts/p7-manual-smoke

      - name: Assert P7 semantic evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('artifacts/p7-region-authority-trace.json').read_text(encoding='utf-8'))
          assert report['all_passed'] is True, report
          assert report['fingerprints_match'] is True, report
          assert len(report['checks']) == 15, report
          first = report['first_run']
          assert first['client_count'] == 4, first
          assert first['static_region_count'] == 3, first
          assert first['mobile_region_count'] == 1, first
          assert first['stale_writer_rejected'] is True, first
          assert first['transfer']['unique_entity_locations'] is True, first
          assert first['transfer']['persistent_facts_preserved'] is True, first
          assert first['mobile']['internal_authority_preserved'] is True, first
          assert first['mobile']['transfer_count_before_move'] == first['mobile']['transfer_count_after_move'], first
          assert first['remote_person_is_not_detailed'] is True, first
          assert first['parallel']['identical'] is True, first
          assert first['parallel']['max_parallel_workers'] >= 2, first
          assert first['hotspot']['unique_writers'] == 1, first
          assert first['hotspot']['revisions_contiguous'] is True, first

          smoke = json.loads(Path('artifacts/p7-manual-smoke/p7-validation-report.json').read_text(encoding='utf-8'))
          assert smoke['all_passed'] is True, smoke
          assert smoke['first_run']['final_fingerprint'] == smoke['repeat_run']['final_fingerprint'], smoke
          print('P7 semantic evidence passed.')
          PY

      - name: Build prior regressions and P7 manual executable
        run: |
          cargo build --locked -p p6_manual_validation
          cargo build --release --locked -p p7_manual_validation

      - name: Write gate summary
        run: |
          {
            echo '# P7 multiplayer interest and region authority automated gate'
            echo
            echo 'Result: **PASS**'
            echo
            echo "Validated source: ${{ github.event.pull_request.head.sha || github.sha }}"
            echo "Workflow run: ${GITHUB_RUN_ID}"
            echo
            echo '- four independent client projections'
            echo '- visual, simulation, junction, window and trajectory interests'
            echo '- static and mobile regions with single writer epochs'
            echo '- stale writer rejection after rebalance'
            echo '- idempotent recoverable cross-region transfers'
            echo '- mobile ship interior authority across static cells'
            echo '- remote Cold/Warm summaries without entity deletion'
            echo '- deterministic parallel independent regions'
            echo '- single-writer hotspot sequencing'
            echo '- P0 through P6 regression checks'
          } > artifacts/p7-region-authority-gate-summary.md

      - name: Normalize P7 awaiting-manual status for evidence
        run: >-
          python scripts/finalize_p7.py
          --mode awaiting-manual
          --workflow-run ${GITHUB_RUN_ID}
          --source ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Upload P7 automated evidence and generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: p7-region-authority-automated-evidence
          path: |
            Cargo.lock
            prototype-status.json
            artifacts/p1-camera-trace.json
            artifacts/p2-reference-frame-trace.json
            artifacts/p3-building-trace.json
            artifacts/p4-region-scale-trace.json
            artifacts/p5-authority-trace.json
            artifacts/p6-simulation-scale-trace.json
            artifacts/p7-region-authority-trace.json
            artifacts/p7-manual-smoke/p7-validation-report.json
            artifacts/p7-manual-smoke/p7-client-interests.json
            artifacts/p7-manual-smoke/p7-transfer-evidence.json
            artifacts/p7-region-authority-gate-summary.md
          if-no-files-found: error
          retention-days: 30

  package:
    name: Windows x64 P7 manual acceptance package
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout exact validated P7 source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Download P7 automated evidence
        uses: actions/download-artifact@v4
        with:
          name: p7-region-authority-automated-evidence
          path: evidence

      - name: Install exact Linux-validated Cargo lockfile
        shell: pwsh
        run: |
          $lock = Get-ChildItem evidence -Recurse -Filter Cargo.lock | Select-Object -First 1
          if ($null -eq $lock) { throw 'Validated Cargo.lock was not found.' }
          Copy-Item $lock.FullName .\Cargo.lock -Force

      - name: Build P7 release executable
        run: cargo build --release --locked -p p7_manual_validation

      - name: Run Windows automatic region-authority validation
        shell: pwsh
        run: |
          .\target\release\p7_manual_validation.exe --auto --data-dir p7-windows-smoke
          $report = Get-Content p7-windows-smoke\p7-validation-report.json -Raw | ConvertFrom-Json
          if (-not $report.all_passed) { throw 'Windows P7 smoke report failed.' }
          if (-not $report.fingerprints_match) { throw 'Windows P7 deterministic fingerprint mismatch.' }
          if ($report.first_run.client_count -ne 4) { throw 'Four clients were not materialized.' }
          if ($report.first_run.hotspot.unique_writers -ne 1) { throw 'Hotspot violated single-writer authority.' }

      - name: Assemble manual acceptance package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\p7_manual_validation.exe dist\p7_manual_validation.exe
          Copy-Item docs\visual-acceptance\p7-region-authority-checklist.md dist\p7-region-authority-checklist.md
          Copy-Item scripts\collect_p7_machine_info.ps1 dist\collect_p7_machine_info.ps1
          $trace = Get-ChildItem evidence -Recurse -Filter p7-region-authority-trace.json | Select-Object -First 1
          if ($null -eq $trace) { throw 'P7 authority trace was not found.' }
          Copy-Item $trace.FullName dist\p7-region-authority-trace.json
          Copy-Item p7-windows-smoke\p7-validation-report.json dist\p7-windows-smoke-report.json
          Copy-Item p7-windows-smoke\p7-client-interests.json dist\p7-windows-client-interests.json
          Copy-Item p7-windows-smoke\p7-transfer-evidence.json dist\p7-windows-transfer-evidence.json
          @"
          # P7 多人兴趣域、区域单写与跨区权威人工验收包

          Validated source: ${{ github.event.pull_request.head.sha || github.sha }}
          Workflow run: $env:GITHUB_RUN_ID

          ## 运行

          1. 完整解压，不要在 ZIP 中运行。
          2. 在解压目录打开 PowerShell。
          3. 执行：

             powershell -ExecutionPolicy Bypass -File .\collect_p7_machine_info.ps1
             .\p7_manual_validation.exe

          4. 程序会执行四客户端、三静态区域、一移动船舶区域的完整确定性场景两次。
          5. 每完成一项检查会暂停；对照 p7-region-authority-checklist.md 后按 Enter。
          6. 完成后保留 p7-data、p7-machine-info.txt 和控制台录屏。

          ## 自动复跑

          .\p7_manual_validation.exe --auto --data-dir p7-data-auto
          "@ | Set-Content -Encoding UTF8 dist\RUN.md

      - name: Upload Windows manual acceptance package
        uses: actions/upload-artifact@v4
        with:
          name: p7-region-authority-manual-validation-windows-x64
          path: dist
          if-no-files-found: error
          retention-days: 30
