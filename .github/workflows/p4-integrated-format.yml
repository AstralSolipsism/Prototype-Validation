name: p4-integrated-format

on:
  push:
    branches:
      - agent/p4-integrated-world-pipeline
    paths:
      - .github/workflows/p4-integrated-format.yml

permissions:
  contents: write

concurrency:
  group: p4-integrated-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: format integrated P4 sources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout integrated P4 branch
        uses: actions/checkout@v4
        with:
          ref: agent/p4-integrated-world-pipeline

      - name: Install Rustfmt
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Apply rustfmt
        run: cargo fmt --all

      - name: Commit formatted sources and remove this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p4-integrated-format.yml
          git add crates/integrated_world_core crates/p4_integrated_scenario apps/p4_integrated_trace
          git commit -m "Format integrated P4 sources"
          git push origin HEAD:agent/p4-integrated-world-pipeline
