name: p5-authority-final-gate

on:
  push:
    branches:
      - agent/p5-authoritative-server-persistence
    paths-ignore:
      - docs/evidence/p5-authority-final-gate.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p5-authority-final-gate
  cancel-in-progress: false

env:
  P5_BRANCH: agent/p5-authoritative-server-persistence

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    name: authority, persistence, recovery, replay and regressions
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      gate_status: ${{ steps.gate.outputs.status }}

    steps:
      - name: Checkout P5 branch with history
        uses: actions/checkout@v4
        with:
          ref: ${{ env.P5_BRANCH }}
          fetch-depth: 0

      - name: Record gate start
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/evidence
          {
            echo '# P5 authoritative server final automated gate'
            echo
            echo 'Result: **IN_PROGRESS**'
            echo
            echo "Workflow run: ${GITHUB_RUN_ID}"
            echo "Starting source: $(git rev-parse HEAD)"
            echo "Branch: ${P5_BRANCH}"
          } > docs/evidence/p5-authority-final-gate.md

      - name: Install Bevy Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            g++ pkg-config libx11-dev libasound2-dev libudev-dev \
            libxkbcommon-x11-0 libwayland-dev libxkbcommon-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Apply deterministic P5 source finalizer
        run: python scripts/finalize_p5.py

      - name: Format, resolve lockfile and persist source changes
        id: source
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo generate-lockfile
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Finalize P5 authority validation sources"
            git push origin "HEAD:${P5_BRANCH}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run complete P5 automated gate and retain diagnostics
        id: gate
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/p5-data docs/evidence
          (
            set -euo pipefail
            echo '## Static architecture and stage checks'
            ./scripts/run_static_checks.sh
            echo '## Formatting'
            cargo fmt --all -- --check
            echo '## Dependency lockfile'
            test -f Cargo.lock
            echo '## Complete workspace cargo check'
            cargo check --workspace --all-targets --locked
            echo '## Complete workspace strict Clippy'
            cargo clippy --workspace --all-targets --locked -- -D warnings
            echo '## Engine-independent tests and console applications'
            cargo test --workspace \
              --exclude camera_routes \
              --exclude mobile_region_visual \
              --exclude building_visual \
              --exclude world_visual \
              --exclude integrated_world_visual \
              --exclude p4_region_scale_visual \
              --all-targets --locked
            echo '## P1 headless evidence'
            cargo run --locked -p camera_trace -- artifacts/p1-camera-trace.json
            echo '## P2 headless evidence'
            cargo run --locked -p p2_reference_frame_trace -- artifacts/p2-reference-frame-trace.json
            echo '## P3 headless evidence'
            cargo run --locked -p p3_building_trace -- artifacts/p3-building-trace.json
            echo '## P4A headless evidence'
            cargo run --locked -p p4_world_trace -- artifacts/p4-world-trace.json
            echo '## P4 integrated evidence'
            cargo run --locked -p p4_integrated_trace -- artifacts/p4-integrated-world-trace.json
            echo '## P4 corrected region-scale evidence'
            cargo run --locked -p p4_region_scale_trace -- artifacts/p4-region-scale-trace.json
            echo '## P5 authoritative TCP, persistence and recovery trace'
            cargo run --locked -p p5_authority_trace -- artifacts/p5-authority-trace.json
            echo '## P5 manual executable automatic smoke run'
            cargo run --locked -p p5_manual_validation -- --auto --data-dir artifacts/p5-manual-smoke
            echo '## P5 report assertions'
            python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('artifacts/p5-authority-trace.json').read_text(encoding='utf-8'))
          assert report['all_passed'] is True, report
          assert report['pre_crash_fingerprint'] == report['recovered_fingerprint'], report
          assert report['duplicate_receipts'] >= 2, report
          assert report['rejected_receipts'] >= 2, report
          assert report['buffered_out_of_order_commands'] >= 1, report
          assert report['journal_records'] >= 10, report
          print('P5 report assertions passed.')
          PY
            echo '## Existing Bevy regression builds'
            cargo build --locked -p camera_routes
            cargo build --locked -p mobile_region_visual
            cargo build --locked -p building_visual
            cargo build --locked -p p4_region_scale_visual
            echo '## P5 Windows-packaged console application Linux build'
            cargo build --locked -p p5_manual_validation
          ) 2>&1 | tee artifacts/p5-authority-final-gate.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 0 ]; then result=PASS; else result=FAIL; fi
          {
            echo '# P5 authoritative server final automated gate'
            echo
            echo "Result: **${result}**"
            echo
            echo "Workflow run: ${GITHUB_RUN_ID}"
            echo "Validated source: ${{ steps.source.outputs.sha }}"
            echo "Branch: ${P5_BRANCH}"
            echo
            if [ "$status" -eq 0 ]; then
              echo '## Passed gates'
              echo
              echo '- complete workspace formatting, compilation and strict Clippy'
              echo '- P0 through P4 deterministic and Bevy regressions'
              echo '- engine-independent authoritative world state and typed commands'
              echo '- persistent idempotency and structured version/permission rejection'
              echo '- ordered buffering of delayed and out-of-order client requests'
              echo '- real loopback TCP server with two independent client projections'
              echo '- atomic region snapshot and transactional append-only journal'
              echo '- disconnect/reconnect and snapshot-plus-journal process recovery'
              echo '- recovery fingerprint equality and client cache reconstruction'
              echo
              echo 'The Windows x64 manual package may now run from the same workflow.'
            else
              echo '## Failure summary'
              echo
              echo '```text'
              grep -E 'error(\[E[0-9]+\])?:|panicked at|FAILED|failed|P5 authority trace failed|FINAL RESULT: FAIL' \
                artifacts/p5-authority-final-gate.log | tail -n 220 || true
              echo '```'
              echo
              echo '## Diagnostic tail'
              echo
              echo '```text'
              tail -n 300 artifacts/p5-authority-final-gate.log
              echo '```'
            fi
          } > docs/evidence/p5-authority-final-gate.md
          exit 0

      - name: Mark P5 ready for manual validation after success
        if: steps.gate.outputs.status == '0'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('prototype-status.json')
          status = json.loads(path.read_text(encoding='utf-8'))
          p5 = next(stage for stage in status['stages'] if stage['id'] == 'P5')
          p5['status'] = 'automated-gate-passed-awaiting-manual-validation'
          p5['passed'] = False
          p5['ready_to_start'] = False
          p5['automated_gate'] = {
              'workflow_run': int('${{ github.run_id }}'),
              'validated_source': '${{ steps.source.outputs.sha }}',
              'result': 'passed',
          }
          p5['evidence_present'] = [
              'engine-independent authoritative world state and command model',
              'persistent idempotency ledger and structured version rejection',
              'atomic region snapshot and transactional append-only journal',
              'ordered ingress for duplicate, delayed and out-of-order commands',
              'real loopback TCP authority server and two client projections',
              'disconnect/reconnect and snapshot-plus-journal process recovery',
              'recovery semantic fingerprint equality',
              'successful complete workspace gate and P0-P4 regressions',
              'Windows x64 manual package produced by this workflow',
          ]
          p5['evidence_missing'] = ['project owner manual acceptance']
          path.write_text(json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Upload automated evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5-authority-automated-evidence
          path: |
            artifacts/p1-camera-trace.json
            artifacts/p2-reference-frame-trace.json
            artifacts/p3-building-trace.json
            artifacts/p4-world-trace.json
            artifacts/p4-integrated-world-trace.json
            artifacts/p4-region-scale-trace.json
            artifacts/p5-authority-trace.json
            artifacts/p5-authority-final-gate.log
            artifacts/p5-authority-trace.data/region-snapshot.json
            artifacts/p5-authority-trace.data/command-journal.ndjson
            artifacts/p5-authority-trace.data/p5-validation-report.json
            artifacts/p5-manual-smoke/p5-validation-report.json
            docs/evidence/p5-authority-final-gate.md
          if-no-files-found: warn
          retention-days: 30

      - name: Persist final gate result and stage status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evidence/p5-authority-final-gate.md prototype-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Record P5 authority final gate result"
            git push origin "HEAD:${P5_BRANCH}"
          fi

      - name: Fail after diagnostics are persisted
        if: steps.gate.outputs.status != '0'
        run: exit 1

  package:
    if: needs.validate.outputs.gate_status == '0'
    needs: validate
    name: Windows x64 P5 manual validation package
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout validated P5 source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Download automated evidence
        uses: actions/download-artifact@v4
        with:
          name: p5-authority-automated-evidence
          path: evidence

      - name: Build P5 Windows executable
        run: cargo build --release --locked -p p5_manual_validation

      - name: Run P5 Windows automatic smoke validation
        shell: pwsh
        run: |
          .\target\release\p5_manual_validation.exe --auto --data-dir p5-windows-smoke
          $report = Get-Content p5-windows-smoke\p5-validation-report.json -Raw | ConvertFrom-Json
          if (-not $report.all_passed) { throw 'Windows P5 smoke report failed.' }
          if ($report.pre_crash_fingerprint -ne $report.recovered_fingerprint) {
            throw 'Windows recovery fingerprint mismatch.'
          }

      - name: Assemble P5 manual package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\p5_manual_validation.exe dist\p5_manual_validation.exe
          Copy-Item docs\visual-acceptance\p5-authority-checklist.md dist\p5-authority-checklist.md
          Copy-Item scripts\collect_p5_machine_info.ps1 dist\collect_p5_machine_info.ps1
          $trace = Get-ChildItem evidence -Recurse -Filter p5-authority-trace.json | Select-Object -First 1
          if ($null -eq $trace) { throw 'P5 automated trace was not found.' }
          Copy-Item $trace.FullName dist\p5-authority-trace.json
          Copy-Item p5-windows-smoke\p5-validation-report.json dist\p5-windows-smoke-report.json
          @"
          # P5 权威服务端、存档、恢复与回放人工验收包

          Validated source: ${{ needs.validate.outputs.source_sha }}
          Workflow run: $env:GITHUB_RUN_ID

          ## 运行

          1. 完整解压，不要在 ZIP 中直接运行。
          2. 在解压目录打开 PowerShell。
          3. 执行：

             powershell -ExecutionPolicy Bypass -File .\collect_p5_machine_info.ps1
             .\p5_manual_validation.exe

          4. 程序每完成一步会暂停；按 p5-authority-checklist.md 检查后按 Enter 继续。
          5. 完成后保留 p5-data 目录、p5-machine-info.txt 和完整控制台录屏。

          ## 自动运行

          .\p5_manual_validation.exe --auto --data-dir p5-data-auto

          ## 通过条件

          - 所有步骤均显示 PASS；
          - 同一 CommandId 不重复执行；
          - 乱序请求按 session sequence 提交；
          - 过期版本与越权操作被拒绝；
          - 断线重连不丢状态；
          - 服务端重启后快照与日志恢复到相同 revision 和 fingerprint；
          - A、B 两个客户端最终状态一致。
          "@ | Set-Content -Encoding UTF8 dist\RUN.md

      - name: Upload P5 Windows manual package
        uses: actions/upload-artifact@v4
        with:
          name: p5-authority-manual-validation-windows-x64
          path: dist
          if-no-files-found: error
          retention-days: 30
