name: ci

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrated-autofix:
    name: temporary integrated P4 source autofix
    if: github.event_name == 'push' && github.ref == 'refs/heads/agent/p4-integrated-world-pipeline'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout integrated branch
        uses: actions/checkout@v4
        with:
          ref: agent/p4-integrated-world-pipeline

      - name: Apply known first compile fixes
        shell: python
        run: |
          from pathlib import Path

          terrain = Path("crates/integrated_world_core/src/terrain.rs")
          text = terrain.read_text(encoding="utf-8")
          text = text.replace(
              "        let mut downstream = None;\n",
              "        let mut downstream: Option<usize> = None;\n",
          )
          terrain.write_text(text, encoding="utf-8")

          history = Path("crates/integrated_world_core/src/history.rs")
          text = history.read_text(encoding="utf-8")
          anchor = "pub fn apply_history_to_atlas(\n    atlas: &mut WorldAtlasManifest,\n    history: &HistoryLedger,\n) -> Result<(), serde_json::Error> {\n"
          if "let cell_radius_m = atlas.cell_radius_m;" not in text:
              text = text.replace(anchor, anchor + "    let cell_radius_m = atlas.cell_radius_m;\n", 1)
          text = text.replace(
              "cell_at_position(cell.coord, atlas.cell_radius_m, event.location.xz())",
              "cell_at_position(cell.coord, cell_radius_m, event.location.xz())",
          )
          history.write_text(text, encoding="utf-8")

          validate = Path("crates/integrated_world_core/src/validate.rs")
          text = validate.read_text(encoding="utf-8")
          text = text.replace(
              "use world_generation_core::{BoundaryKey, HexCoord, WorldManifest};",
              "use world_generation_core::{HexCoord, WorldManifest};",
          )
          text = text.replace(
              "use world_ids::{EntityId, EventId};",
              "use world_ids::EntityId;",
          )
          validate.write_text(text, encoding="utf-8")

          Path(".github/workflows/p4-integrated-first-compile-fix.yml").unlink(missing_ok=True)

      - name: Install Rustfmt
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Format and commit when changed
        shell: bash
        run: |
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No integrated autofix changes remain."
            exit 0
          fi
          git commit -m "Fix initial integrated P4 compile errors"
          git push origin HEAD:agent/p4-integrated-world-pipeline

  validate:
    name: architecture, rust, headless prototype
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bevy Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            g++ \
            pkg-config \
            libx11-dev \
            libasound2-dev \
            libudev-dev \
            libxkbcommon-x11-0 \
            libwayland-dev \
            libxkbcommon-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run static preproduction checks
        run: ./scripts/run_static_checks.sh

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Resolve dependency lockfile
        run: cargo generate-lockfile

      - name: Check workspace including Bevy applications
        run: cargo check --workspace --all-targets --locked

      - name: Clippy workspace including Bevy applications
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test engine-independent crates and headless applications
        run: >-
          cargo test --workspace
          --exclude camera_routes
          --exclude mobile_region_visual
          --exclude building_visual
          --exclude world_visual
          --all-targets --locked

      - name: Generate P1 headless camera trace
        run: cargo run --locked -p camera_trace -- artifacts/p1-camera-trace.json

      - name: Generate P2 headless reference-frame trace
        run: >-
          cargo run --locked -p p2_reference_frame_trace --
          artifacts/p2-reference-frame-trace.json

      - name: Generate P3 headless building compiler trace
        run: >-
          cargo run --locked -p p3_building_trace --
          artifacts/p3-building-trace.json

      - name: Generate P4A deterministic world trace
        run: >-
          cargo run --locked -p p4_world_trace --
          artifacts/p4-world-trace.json

      - name: Generate integrated P4 Atlas-to-scroll trace
        run: >-
          cargo run --locked -p p4_integrated_trace --
          artifacts/p4-integrated-world-trace.json

      - name: Upload dependency lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: Cargo.lock
          if-no-files-found: warn

      - name: Upload headless evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: headless-prototype-evidence
          path: |
            artifacts/p1-camera-trace.json
            artifacts/p2-reference-frame-trace.json
            artifacts/p3-building-trace.json
            artifacts/p4-world-trace.json
            artifacts/p4-integrated-world-trace.json
          if-no-files-found: error
